# Mushlord skills
#
# Version 3D (ModelEngine + DextraBossesPack):
#  - state{mid=mushlord;...} lanza la animacion; los "delay" coinciden con el golpe de cada una.
#  - Sonidos "dextra:mushlord.*" = sonidos propios del pack, siempre junto al vanilla de antes.
#  - summon{type=MS_FX_...} = efectos 3D de cada ataque (mobs invisibles que se borran solos).
#  - El titulo de aparicion se manda con /title y un texto traducible: sin pack se ve
#    "MUSHLORD" como siempre; con pack se ve el logo.

Mushlord_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - state{mid=mushlord;s=spawn;li=0;lo=4} @self
    - 'command{c="minecraft:title @a times 20 300 20"} @self'
    - 'command{c="minecraft:title @a subtitle <&lc>text:''§aMushroom Island §8• §7Señor de las Espiras Corruptas''<&rc>"} @self'
    - 'command{c="minecraft:title @a title <&lc>translate:''dextra.title.mushlord'',fallback:''§2§lMUSHLORD'',with:<&lb><&lc>text:'''',font:''dextra:hud'',color:''white''<&rc><&rb><&rc>"} @self'
    - effect:sound{s=dextra:mushlord.intro;v=1;p=1} @self
    - summon{type=MS_FX_Bloom;amount=1;radius=0;noise=0} @selflocation
    - 'message{m="&2&lMUSHLORD &f: &7Bienvenidos… a mi jardín eterno…"} @Server'
    - effect:sound{s=entity.zombie_villager.converted;v=0.7;p=0.7} @self
    - effect:particles{particle=SLIME;amount=28;hS=1.0;vS=0.6;speed=0.02} @self
    - effect:particles{particle=REDSTONE;amount=40;hS=1.2;vS=1.0;speed=0.0;color=#5aa34b;size=1.3} @self
    - effect:particles{particle=SPORE_BLOSSOM_AIR;amount=18;hS=1.0;vS=0.8;speed=0.02} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

Mushlord_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
