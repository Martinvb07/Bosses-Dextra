# --- Fuego amigo ---
LV_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_Leviatan} true
  Skills:
    - cancelevent @self

# --- Invocacion con estrella (/warp bosses) ---
# TODO: poner las coordenadas reales del altar de Leviatan. Hay que cambiarlas en
#       las DOS lineas marcadas con <<< (distancefromlocation y @Location).
LV_ItemSummon:
  Conditions:
    - skilloncooldown{skill=LV_ItemSummon_AtCoords} castinstead LV_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast LV_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=0.5;y=100;z=0.5;world=Spawn;distance=<6} orElseCast LV_ItemSummon_Fail_NotAtSpot   # <<<
  Skills:
    - skill{s=LV_ItemSummon_AtCoords} @Location{x=0.5;y=100;z=0.5;world=Spawn}   # <<<

LV_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=Leviatan;amount=<1;r=100} orElseCast LV_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=0.85} @self
    - particlering{particle=REDSTONE;radius=3.0;points=48;amount=1;hS=0;vS=0;speed=0.0;color=#1f8fa8;size=1.25} @targetlocation{y=0.1}
    - particlering{particle=REDSTONE;radius=1.6;points=28;amount=1;hS=0;vS=0;speed=0.0;color=#6fe3ff;size=1.15} @targetlocation{y=0.1}
    - delay 8
    - effect:particles{particle=PORTAL;amount=60;hS=0.7;vS=0.2;speed=0.15} @targetlocation{y=1}
    - effect:particles{particle=SMOKE_LARGE;amount=14;hS=0.7;vS=0.6;speed=0.02} @targetlocation{y=1}
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=Leviatan;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumehelditem{a=1} @self
    - message{cooldown=2;m="&3&lLEVIATAN &8» &bLas aguas se agitan... &3Leviatan emerge del abismo&b."} @self

LV_ItemSummon_Fail_AlreadyActive:
  Skills:
    - message{cooldown=2;m="&3&lLEVIATAN &8» &7Las aguas ya hierven. Derrota a &3Leviatan &7antes de invocar otro."} @self

LV_ItemSummon_Fail_NotAtSpot:
  Skills:
    - message{cooldown=2;m="&3&lLEVIATAN &8» &eLa estrella solo brilla junto al &6Altar de las Mareas&e. &7Acercate al altar."} @self

LV_ItemSummon_Fail_WrongWorld:
  Skills:
    - message{cooldown=2;m="&3&lLEVIATAN &8» &eEl abismo no oye tu llamado aqui. &7Regresa al &6Altar de Invocacion&7."} @self

LV_ItemSummon_Fail_Cooldown:
  Skills:
    - message{cooldown=2;m="&3&lLEVIATAN &8» &7La estrella aun esta empapada. &fEspera un momento&7."} @self
