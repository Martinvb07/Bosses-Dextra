# Leviatan - Skills de combate PROPIAS (antes usaba las de Baal tal cual).
# Mecanicas basadas en Baal, con lore, subditos y particulas de Leviatan.
# Daño de skills escalado x1.00 y umbrales de vida para 3800 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.
#
# Version 3D (ModelEngine + DextraBossesPack):
#  - state{mid=leviatan;...} lanza la animacion; los "delay" coinciden con el golpe de cada una.
#  - Sonidos "dextra:leviatan.*" = sonidos propios del pack, siempre junto al vanilla de antes.
#  - summon{type=..._FX_...} = efectos 3D de cada ataque (mobs invisibles que se borran solos).
#  - El titulo de aparicion se manda con /title y un texto traducible: sin pack se ve
#    "LEVIATAN" como siempre; con pack se ve el logo.

LV_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - state{mid=leviatan;s=spawn;li=0;lo=4} @self
    - 'command{c="minecraft:title @a times 20 300 20"} @self'
    - 'command{c="minecraft:title @a subtitle <&lc>text:''§bFosa Abisal §8• §7El Rey del Abismo emerge''<&rc>"} @self'
    - 'command{c="minecraft:title @a title <&lc>translate:''dextra.title.leviatan'',fallback:''§3§lLEVIATAN'',with:<&lb><&lc>text:'''',font:''dextra:hud'',color:''white''<&rc><&rb><&rc>"} @self'
    - effect:sound{s=dextra:leviatan.intro;v=1;p=1} @self
    - summon{type=LV_FX_Phase;amount=1;radius=0;noise=0} @selflocation
    - 'message{m="&3&lLEVIATAN &f: &7Las profundidades os reclaman. Nadie respira en mi reino."} @Server'
    - effect:sound{s=entity.skeleton.ambient;v=0.8;p=0.8} @self
    - effect:particles{particle=SOUL;amount=18;hS=1.0;vS=0.9;speed=0.02} @self
    - effect:particles{particle=BLOCK_CRACK;material=PRISMARINE;amount=24;hS=1.2;vS=0.9;speed=0.03} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

LV_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

LV_HP70_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<2660}
  Skills:
    - 'message{m="&3&lLEVIATAN &8» &fLa marea se embravece... &b70% &fde vida y las aguas suben."} @PlayersInRadius{r=60}'

LV_HP40_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1519}
  Skills:
    - 'message{m="&3&lLEVIATAN &8» &fEl abismo se oscurece con el &b40% &fde su vida restante..."} @PlayersInRadius{r=60}'

LV_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<2660}
  Skills:
    - skill{s=LV_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - summon{type=Leviatan_Ahogado;amount=2;radius=7;noise=2} @self
    - summon{type=Leviatan_Marea;amount=1;radius=7;noise=2} @self
    - effect:sound{s=entity.evoker.prepare_summon;v=0.8;p=0.8} @self

LV_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<1519}
  Skills:
    - skill{s=LV_PhaseShield} @self
    - setstance{stance=PHASE3} @self
    - skill{s=LV_ShadowVeil} @self
    - summon{type=Leviatan_Anguila;amount=2;radius=6;noise=2} @self
    - summon{type=Leviatan_Marea;amount=1;radius=6;noise=2}

LV_PhaseShield:
  Skills:
    - state{mid=leviatan;s=phase_change;li=3;lo=4} @self
    - effect:sound{s=dextra:leviatan.phase;v=1;p=1} @self
    - summon{type=LV_FX_Phase;amount=1;radius=0;noise=0} @selflocation
    - potion{type=DAMAGE_RESISTANCE;duration=50;level=4} @self
    - effect:particles{particle=SPELL_MOB_AMBIENT;amount=18;hS=0.8;vS=0.7;speed=0.02} @self

LV_Aura:
  Skills:
    - effect:particles{particle=BLOCK_CRACK;material=PRISMARINE;amount=5;hS=0.6;vS=0.7;speed=0.03;yOffset=1.0} @self
    - effect:particles{particle=SOUL;amount=3;hS=0.5;vS=0.8;speed=0.02;yOffset=1.0} @self

LV_Attack_Rotation:
  Skills:
    - randomskill{skills=LV_SpiritCurse,LV_ShadowStep,LV_SummonYokai;weights=4,3,2} @target ?stance{stance=PHASE1}
    - randomskill{skills=LV_SpiritCurse,LV_ShadowStep,LV_SakuraHex,LV_SummonSamurai;weights=3,3,3,2} @target ?stance{stance=PHASE2}
    - randomskill{skills=LV_ShadowVeil,LV_SakuraHex,LV_SpiritNova,LV_SummonNinjas;weights=2,3,3,2} @target ?stance{stance=PHASE3}

LV_SpiritCurse:
