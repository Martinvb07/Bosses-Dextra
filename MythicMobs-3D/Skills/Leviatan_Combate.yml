  Conditions:
    - targetwithin{d=22}
  Skills:
    - state{mid=leviatan;s=curse;li=1;lo=2} @self
    - effect:sound{s=dextra:leviatan.curse;v=1;p=1} @self
    - summon{type=LV_FX_Curse;amount=1;radius=0;noise=0} @targetlocation
    - damage{a=90;pk=true} @target
    - potion{type=WEAKNESS;duration=80;level=0} @target
    - potion{type=CONFUSION;duration=50;level=0} @target

LV_ShadowStep:
  Cooldown: 16
  Conditions:
    - targetwithin{d=24}
  Skills:
    - state{mid=leviatan;s=lunge;li=1;lo=2} @self
    - effect:sound{s=entity.enderman.teleport;v=0.7;p=0.7} @self
    - effect:sound{s=dextra:leviatan.splash;v=1;p=1} @self
    - summon{type=LV_FX_Splash;amount=1;radius=0;noise=0} @selflocation
    - effect:particles{particle=SMOKE_LARGE;amount=14;hS=0.5;vS=0.35;speed=0.02} @self
    - leap{velocity=180;noise=1} @target
    - delay 12
    - summon{type=LV_FX_Splash;amount=1;radius=0;noise=0} @targetlocation
    - damage{a=84;pk=true} @target ?distance{d=<3}

