Kukulkan_Rank_Reset:
  Skills:
    - modifyscore{o=kukulkan_dmg;e=#kukulkan;a=set;v=0} @self
    - modifyscore{o=kukulkan_pool;e=#kukulkan;a=set;v=0} @self
    - modifyscore{o=kukulkan_rank;e=#kukulkan;a=set;v=0} @self
    - 'command{c="minecraft:scoreboard players reset * kukulkan_dmg"} @self'
    - 'command{c="minecraft:scoreboard players reset * kukulkan_pool"} @self'
    - 'command{c="minecraft:scoreboard players reset * kukulkan_rank"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top] run minecraft:tag @s remove kukulkan_top"} @self'

Kukulkan_Rank_Sumar:
  TriggerConditions:
    - entitytype{t=PLAYER}
  Skills:
    - setvariable{var=skill.kdmg;type=INTEGER;value="<skill.var.damage-amount>"} @self
    - modifyscore{o=kukulkan_dmg;e=<trigger.name>;a=add;v=<skill.var.kdmg>} @self

Kukulkan_Rank_Calcular:
  Skills:
    - 'command{c="minecraft:execute as @a if score @s kukulkan_dmg matches 1.. run minecraft:scoreboard players operation @s kukulkan_pool = @s kukulkan_dmg"} @self'

    - 'command{c="minecraft:scoreboard players set #kukulkan kukulkan_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. run minecraft:scoreboard players operation #kukulkan kukulkan_pool > @s kukulkan_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. if score @s kukulkan_pool = #kukulkan kukulkan_pool run minecraft:tag @s add kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top,limit=1] run minecraft:scoreboard players set @s kukulkan_rank 3"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top] run minecraft:tag @s remove kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_rank matches 3 run minecraft:scoreboard players reset @s kukulkan_pool"} @self'

    - 'command{c="minecraft:scoreboard players set #kukulkan kukulkan_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. run minecraft:scoreboard players operation #kukulkan kukulkan_pool > @s kukulkan_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. if score @s kukulkan_pool = #kukulkan kukulkan_pool run minecraft:tag @s add kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top,limit=1] run minecraft:scoreboard players set @s kukulkan_rank 2"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top] run minecraft:tag @s remove kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_rank matches 2 run minecraft:scoreboard players reset @s kukulkan_pool"} @self'

    - 'command{c="minecraft:scoreboard players set #kukulkan kukulkan_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. run minecraft:scoreboard players operation #kukulkan kukulkan_pool > @s kukulkan_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_pool matches 1.. if score @s kukulkan_pool = #kukulkan kukulkan_pool run minecraft:tag @s add kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top,limit=1] run minecraft:scoreboard players set @s kukulkan_rank 1"} @self'
    - 'command{c="minecraft:execute as @a[tag=kukulkan_top] run minecraft:tag @s remove kukulkan_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s kukulkan_rank matches 1 run minecraft:scoreboard players reset @s kukulkan_pool"} @self'


Kukulkan_Rank_Entregar:
  Skills:
    - 'command{c="minecraft:execute if score <target.name> kukulkan_rank matches 3 run mm items give -d <target.name> Saco_Kukulkan_Top1 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> kukulkan_rank matches 2 run mm items give -d <target.name> Saco_Kukulkan_Top2 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> kukulkan_rank matches 1 run mm items give -d <target.name> Saco_Kukulkan_Top3 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> kukulkan_dmg matches 1.. unless score <target.name> kukulkan_rank matches 1..3 run mm items give -d <target.name> Saco_Kukulkan_Consuelo 1"} @PlayersInWorld'

Kukulkan_Rank_Muerte:
  Skills:
    - skill{s=Kukulkan_Rank_Calcular} @self
    - skill{s=Kukulkan_Rank_Entregar} @self
