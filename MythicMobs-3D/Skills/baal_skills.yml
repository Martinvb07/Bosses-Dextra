# Item summon
Baal_ItemSummon:
  Conditions:
    - skilloncooldown{skill=Baal_ItemSummon_AtCoords} castinstead Baal_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast Baal_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=771.5;y=131;z=262.5;world=Spawn;distance=<6} orElseCast Baal_ItemSummon_Fail_NotAtSpot
  Skills:
    - skill{s=Baal_ItemSummon_AtCoords} @Location{x=771.5;y=131;z=262.5;world=Spawn}

Baal_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=Baal;amount=<1;r=100} orElseCast Baal_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=1.05} @self
    - particlering{particle=REDSTONE;radius=3.0;points=48;amount=1;hS=0;vS=0;speed=0.0;color=#d36cff;size=1.25} @targetlocation{y=0.1}
    - particlering{particle=REDSTONE;radius=1.6;points=28;amount=1;hS=0;vS=0;speed=0.0;color=#ff7bd4;size=1.15} @targetlocation{y=0.1}
    - effect:particles{particle=CHERRY_LEAVES;amount=24;hS=0.8;vS=0.2;speed=0.06} @targetlocation{y=0.2}
    - effect:particles{particle=SOUL;amount=14;hS=0.6;vS=0.05;speed=0.02} @targetlocation{y=0.2}
    - delay 8
    - effect:particles{particle=PORTAL;amount=60;hS=0.7;vS=0.2;speed=0.15} @targetlocation{y=1}
    - effect:particles{particle=SMOKE_LARGE;amount=18;hS=0.7;vS=0.6;speed=0.02} @targetlocation{y=1}
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=Baal;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumeuseditem{a=1} @self
    - message{cooldown=2;m="&d&lBAAL &8» &aInvocado."} @self

Baal_ItemSummon_Fail_AlreadyActive:
  Skills:
    - message{cooldown=2;m="&d&lBAAL &8» &7Ya hay un &dBaal &7cerca. Mata al boss antes de invocar otro."} @self

Baal_ItemSummon_Fail_NotAtSpot:
  Skills:
    - message{cooldown=2;m="&d&lBAAL &8» &eNo estas en el &6Altar de Invocacion&e. &7Acercate al altar para usar la estrella."} @self

Baal_ItemSummon_Fail_WrongWorld:
  Skills:
    - message{cooldown=2;m="&d&lBAAL &8» &eLa invocacion no responde en este lugar. &7Regresa al &6Altar de Invocacion&7."} @self

Baal_ItemSummon_Fail_Cooldown:
  Skills:
    - message{cooldown=2;m="&d&lBAAL &8» &7La estrella aun se esta recargando. &fEspera un momento&7."} @self

# --- Fuego amigo ---
Baal_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_Baal} true
  Skills:
    - cancelevent @self
