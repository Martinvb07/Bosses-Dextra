# Baal skills
#
# Version 3D (ModelEngine + DextraBossesPack):
#  - state{mid=baal;...} lanza la animacion; los "delay" coinciden con el golpe de cada una.
#  - Sonidos "dextra:baal.*" = sonidos propios del pack, siempre junto al vanilla de antes.
#  - summon{type=BL_FX_...} = efectos 3D de cada ataque (mobs invisibles que se borran solos).
#  - El titulo de aparicion se manda con /title y un texto traducible: sin pack se ve
#    "BAAL" como siempre; con pack se ve el logo.

Baal_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - state{mid=baal;s=spawn;li=0;lo=4} @self
    - 'command{c="minecraft:title @a times 20 300 20"} @self'
    - 'command{c="minecraft:title @a subtitle <&lc>text:''§5Blossom Temple §8• §7Espiritu vengativo''<&rc>"} @self'
    - 'command{c="minecraft:title @a title <&lc>translate:''dextra.title.baal'',fallback:''§d§lBAAL'',with:<&lb><&lc>text:'''',font:''dextra:hud'',color:''white''<&rc><&rb><&rc>"} @self'
    - effect:sound{s=dextra:baal.intro;v=1;p=1} @self
    - summon{type=BL_FX_Torii;amount=1;radius=0;noise=0} @selflocation
    - 'message{m="&d&lBAAL &8ha despertado... &7el espiritu del templo no acepta intrusos."} @Server'
    - effect:sound{s=entity.skeleton.ambient;v=0.8;p=0.8} @self
    - effect:particles{particle=SOUL;amount=18;hS=1.0;vS=0.9;speed=0.02} @self
    - effect:particles{particle=CHERRY_LEAVES;amount=24;hS=1.2;vS=0.9;speed=0.03} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

Baal_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

Baal_HP70_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1645}
  Skills:
    - 'message{m="&d&lBAAL &8» &fEl espiritu del templo se enfurece con el &d70% &fde su vida..."} @PlayersInRadius{r=60}'

Baal_HP40_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<940}
  Skills:
    - 'message{m="&d&lBAAL &8» &fLas sombras rodean el templo con el &d40% &fde su vida restante..."} @PlayersInRadius{r=60}'

Baal_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<1645}
  Skills:
    - skill{s=Baal_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - effect:sound{s=dextra:baal.summon;v=1;p=1} @self
    - summon{type=UndeadSamurai;amount=2;radius=7;noise=2} @self
    - summon{type=Yokai;amount=1;radius=7;noise=2} @self
    - effect:sound{s=entity.evoker.prepare_summon;v=0.8;p=0.8} @self

Baal_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<940}
  Skills:
    - skill{s=Baal_PhaseShield} @self
    - setstance{stance=PHASE3} @self
    - skill{s=Baal_ShadowVeil} @self
    - summon{type=ShadowNinja;amount=2;radius=6;noise=2} @self
    - summon{type=Yokai;amount=1;radius=6;noise=2}

Baal_PhaseShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=50;level=4} @self
    - state{mid=baal;s=phase_change;li=3;lo=4} @self
    - effect:sound{s=dextra:baal.phase;v=1;p=1} @self
    - summon{type=BL_FX_Torii;amount=1;radius=0;noise=0} @selflocation
    - effect:particles{particle=SPELL_MOB_AMBIENT;amount=18;hS=0.8;vS=0.7;speed=0.02} @self

Baal_Aura:
  Skills:
    - effect:particles{particle=CHERRY_LEAVES;amount=5;hS=0.6;vS=0.7;speed=0.03;yOffset=1.0} @self
    - effect:particles{particle=SOUL;amount=3;hS=0.5;vS=0.8;speed=0.02;yOffset=1.0} @self

Baal_Attack_Rotation:
  Skills:
    - randomskill{skills=Baal_SpiritCurse,Baal_ShadowStep,Baal_SummonYokai;weights=4,3,2} @target ?stance{stance=PHASE1}
    - randomskill{skills=Baal_SpiritCurse,Baal_ShadowStep,Baal_SakuraHex,Baal_SummonSamurai;weights=3,3,3,2} @target ?stance{stance=PHASE2}
    - randomskill{skills=Baal_ShadowVeil,Baal_SakuraHex,Baal_SpiritNova,Baal_SummonNinjas;weights=2,3,3,2} @target ?stance{stance=PHASE3}

Baal_SpiritCurse:
  Cooldown: 14
  Conditions:
    - targetwithin{d=22}
  Skills:
    - state{mid=baal;s=curse;li=2;lo=3} @self
    - effect:sound{s=dextra:baal.curse;v=1;p=1} @self
    - summon{type=BL_FX_Seal;amount=1;radius=0;noise=0} @targetlocation
    - delay 8
    - damage{a=50;pk=true} @target
    - potion{type=WEAKNESS;duration=80;level=0} @target
    - potion{type=CONFUSION;duration=50;level=0} @target

Baal_ShadowStep:
  Cooldown: 16
  Conditions:
    - targetwithin{d=24}
  Skills:
    - state{mid=baal;s=dash_slash;li=2;lo=3} @self
    - effect:sound{s=entity.enderman.teleport;v=0.7;p=0.7} @self
    - effect:sound{s=dextra:baal.step;v=1;p=1} @self
    - summon{type=BL_FX_Smoke;amount=1;radius=0;noise=0} @selflocation
    - effect:particles{particle=SMOKE_LARGE;amount=14;hS=0.5;vS=0.35;speed=0.02} @self
    - leap{velocity=180;noise=1} @target
    - delay 12
    - effect:sound{s=dextra:baal.slash;v=1;p=1} @self
    - summon{type=BL_FX_Slash;amount=1;radius=0;noise=0} @selflocation
    - damage{a=47;pk=true} @target ?distance{d=<3}

