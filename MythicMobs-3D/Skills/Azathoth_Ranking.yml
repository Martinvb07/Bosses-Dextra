Azathoth_Rank_Reset:
  Skills:
    - modifyscore{o=azathoth_dmg;e=#azathoth;a=set;v=0} @self
    - modifyscore{o=azathoth_pool;e=#azathoth;a=set;v=0} @self
    - modifyscore{o=azathoth_rank;e=#azathoth;a=set;v=0} @self
    - 'command{c="minecraft:scoreboard players reset * azathoth_dmg"} @self'
    - 'command{c="minecraft:scoreboard players reset * azathoth_pool"} @self'
    - 'command{c="minecraft:scoreboard players reset * azathoth_rank"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top] run minecraft:tag @s remove azathoth_top"} @self'

Azathoth_Rank_Sumar:
  TriggerConditions:
    - entitytype{t=PLAYER}
  Skills:
    - setvariable{var=skill.kdmg;type=INTEGER;value="<skill.var.damage-amount>"} @self
    - modifyscore{o=azathoth_dmg;e=<trigger.name>;a=add;v=<skill.var.kdmg>} @self

Azathoth_Rank_Calcular:
  Skills:
    - 'command{c="minecraft:execute as @a if score @s azathoth_dmg matches 1.. run minecraft:scoreboard players operation @s azathoth_pool = @s azathoth_dmg"} @self'

    - 'command{c="minecraft:scoreboard players set #azathoth azathoth_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. run minecraft:scoreboard players operation #azathoth azathoth_pool > @s azathoth_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. if score @s azathoth_pool = #azathoth azathoth_pool run minecraft:tag @s add azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top,limit=1] run minecraft:scoreboard players set @s azathoth_rank 3"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top] run minecraft:tag @s remove azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_rank matches 3 run minecraft:scoreboard players reset @s azathoth_pool"} @self'

    - 'command{c="minecraft:scoreboard players set #azathoth azathoth_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. run minecraft:scoreboard players operation #azathoth azathoth_pool > @s azathoth_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. if score @s azathoth_pool = #azathoth azathoth_pool run minecraft:tag @s add azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top,limit=1] run minecraft:scoreboard players set @s azathoth_rank 2"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top] run minecraft:tag @s remove azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_rank matches 2 run minecraft:scoreboard players reset @s azathoth_pool"} @self'

    - 'command{c="minecraft:scoreboard players set #azathoth azathoth_pool 0"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. run minecraft:scoreboard players operation #azathoth azathoth_pool > @s azathoth_pool"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_pool matches 1.. if score @s azathoth_pool = #azathoth azathoth_pool run minecraft:tag @s add azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top,limit=1] run minecraft:scoreboard players set @s azathoth_rank 1"} @self'
    - 'command{c="minecraft:execute as @a[tag=azathoth_top] run minecraft:tag @s remove azathoth_top"} @self'
    - 'command{c="minecraft:execute as @a if score @s azathoth_rank matches 1 run minecraft:scoreboard players reset @s azathoth_pool"} @self'


Azathoth_Rank_Entregar:
  Skills:
    - 'command{c="minecraft:execute if score <target.name> azathoth_rank matches 3 run mm items give -d <target.name> Saco_Azathoth_Top1 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> azathoth_rank matches 2 run mm items give -d <target.name> Saco_Azathoth_Top2 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> azathoth_rank matches 1 run mm items give -d <target.name> Saco_Azathoth_Top3 1"} @PlayersInWorld'
    - 'command{c="minecraft:execute if score <target.name> azathoth_dmg matches 1.. unless score <target.name> azathoth_rank matches 1..3 run mm items give -d <target.name> Saco_Azathoth_Consuelo 1"} @PlayersInWorld'

Azathoth_Rank_Muerte:
  Skills:
    - skill{s=Azathoth_Rank_Calcular} @self
    - skill{s=Azathoth_Rank_Entregar} @self
