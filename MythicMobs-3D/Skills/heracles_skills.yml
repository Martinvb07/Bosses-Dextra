# =====================================================================
#  HERACLES - Skills con ModelEngine (modelo: heracles)
#  Los "delay" estan sincronizados con los fotogramas de impacto de cada
#  animacion del .bbmodel (20 ticks = 1 segundo):
#    attack       impacto 0.50s -> delay 10
#    quake        impacto 1.00s -> delay 20
#    roar         rugido  0.40s -> delay 8
#    charge       embestida 0.25s / impacto 0.50s
#    phase_change golpe 0.60s / pose 1.35s
#    summon       garrote arriba 0.40s
#    spawn        se levanta 1.4-2.1s / alza el garrote 2.45s
#    last_breath  rodilla 0.80s / se levanta 1.60s
#    death        rodillas 1.20s / cae 2.60s (ModelEngine la reproduce solo)
#
#  Subditos (modelos hoplit, spartan_warrior, greek_archer, minotaur):
#    hoplit attack lanzazo 0.35s | spartan attack estocada 0.30s
#    greek_archer shoot suelta 0.40s | minotaur charge salto 0.25s / impacto 0.50s
#
#  Sonidos "olympus:*" = sonidos propios del resource pack (HeraclesPack).
#  Cada uno va junto al sonido vanilla de antes: sin el pack se oye el
#  vanilla (el propio no suena) y con el pack se oyen los dos juntos.
# =====================================================================

Heracles_Strength_On:
  Skills:
    - potion{type=INCREASE_DAMAGE;duration=9999;level=1} @self
    - effect:sound{s=block.beacon.activate;v=0.7;p=1.4} @self

Heracles_Strength_Off:
  Skills:
    - potion{type=INCREASE_DAMAGE;duration=1;level=0} @self
    - effect:sound{s=block.beacon.deactivate;v=0.7;p=1.2} @self

Heracles_Intro:
