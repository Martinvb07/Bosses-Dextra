    - state{mid=heracles;s=spawn;li=0;lo=4} @self
    - effect:sound{s=olympus:heracles.intro;v=1;p=1} @self
    - effect:sound{s=entity.warden.emerge;v=1;p=0.8} @self
    - effect:particles{particle=CAMPFIRE_COSY_SMOKE;amount=20;hS=1.2;vS=0.3;speed=0.02} @self
    # sin pack: "⚔ HERACLES ⚔" de siempre; con pack: laureles a los lados (\u2002 y \u2003)
    - 'title{title="&f &6⚔ &e&lHERACLES &6⚔&f ";subtitle="&8« &7Greek Village &8• &6El campeón del Olimpo ha despertado &8»";fadein=20;stay=300;fadeout=20} @Server'
    - 'message{m="&6&lHERACLES &fenfrenta a los &eDesafiantes&f..."} @Server'
    - potion{type=DAMAGE_RESISTANCE;duration=100;level=3} @self
    - setstance{stance=PHASE1} @self
    - delay 28
    # se pone de pie
    - effect:sound{s=entity.iron_golem.step;v=1;p=0.6} @self
    - effect:sound{s=item.armor.equip_gold;v=1;p=0.8} @self
    - delay 21
    # alza el garrote al cielo
    - effect:sound{s=olympus:heracles.roar;v=1;p=1} @self
    - effect:sound{s=entity.wither.spawn;v=0.7;p=1.2} @self
    - effect:sound{s=entity.lightning_bolt.thunder;v=0.6;p=1.4} @self
    - effect:particles{particle=FLASH;amount=1} @self
    - effect:particles{particle=END_ROD;amount=30;hS=0.4;vS=1.5;speed=0.05;y=3} @self
    - delay 11
    - setai{ai=true} @self
    - settarget @NearestPlayer{r=40}

