# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde mushlord_skills.yml con summon{type=MS_FX_...}.

MS_FX_Swipe:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=ms_fx_swipe;hitbox=false} @self ~onSpawn
    - state{mid=ms_fx_swipe;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=Mushlord_FX_Remove;delay=10} @self ~onSpawn

