# Mushlord + secuaces + zona tóxica

Mushlord:
  Type: ZOMBIE
  Display: "&2&lMUSHLORD &8• &aSeñor de las Espiras Corruptas"
  Health: 2800
  Damage: 65
  Armor: 3419
  Faction: Boss_Mushlord

  Equipment:
    - WOODEN_HOE:HAND
    - "PLAYER_HEAD{skullTexture=eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZGNjOWE0YTdhYWRiMzczYWRjM2JlMDUyNDI5MjRjODk4NWUyZjk5M2RkOGU0ZDk2ZjIwNzIxMDUyZmY3ZTdhOCJ9fX0=}:HEAD"
    - Mushlord_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    # \u2008 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/mushlord.yml)
    # es la moldura de setas a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2008&2&lMUSHLORD&f\u2008"
    Range: 50
    Color: GREEN
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.31
    FollowRange: 40
    KnockbackResistance: 0.78
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - LL_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/mushlord/mushlord.bbmodel
  Skills:
    - model{mid=mushlord} @self ~onSpawn
    - skill{s=Mushlord_Spawn} @self ~onSpawn
    - skill{s=Mushlord_AcquireTarget} @self ~onTimer:10
    - skill{s=Mushlord_HP70_Check} @self ~onTimer:20
    - skill{s=Mushlord_HP40_Check} @self ~onTimer:20
    - skill{s=Mushlord_HP25_Check} @self ~onTimer:20
    - skill{s=Mushlord_Phase2_Check} @self ~onTimer:20
    - skill{s=Mushlord_Phase3_Check} @self ~onTimer:20
    - skill{s=Mushlord_Phase4_Check} @self ~onTimer:20
    - skill{s=Mushlord_Aura} @self ~onTimer:10
    - skill{s=Mushlord_Attack_Rotation} @self ~onTimer:9
    - skill{s=Mushlord_FungalRegrowth} @self ~onTimer:40
    - skill{s=Mushlord_SummonCycle} @self ~onTimer:65
    - skill{s=Mushlord_MapPressure} @self ~onTimer:50
    - skill{s=Mushlord_PlagueApocalypse_Check} @self ~onTimer:45
    - skill{s=Mushlord_AntiKite} @self ~onTimer:35
    - skill{s=Mushlord_ToxicTouch} @target ~onAttack 0.60
    - skill{s=Mushlord_PlayerKill} @target ~onKill
    - skill{s=Mushlord_Death} @self ~onDeath
    - skill{s=Mushlord_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=Mushlord_Hurt} @self ~onDamaged 0.35
    - skill{s=Mushlord_Melee} @self ~onAttack

