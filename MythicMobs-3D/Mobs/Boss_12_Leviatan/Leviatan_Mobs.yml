# Leviatan

Leviatan:
  Type: SKELETON
  Display: "&3&lLEVIATAN &8• &3el Rey del Abismo"
  Health: 3800
  Damage: 80
  Armor: 1750
  Faction: Boss_Leviatan

  Modules:
    ThreatTable: true

  Equipment:
    - TRIDENT:HAND
    - LV_ArmaduraInvisible:CHEST
    - LV_CoronaAbismo:HEAD

  BossBar:
    Enabled: true
    # \u3000 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/leviatan.yml)
    # es la moldura de olas y coral a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f　&3&lLEVIATAN&f　"
    Range: 50
    Color: PINK
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.65
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>LEVIATAN 3800 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>LEVIATAN 3800 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    - Leviatan_Nada 1 1
   # - Recompensas_xp
   # - Recompensas_runas
   # - Recompensas_dinero
   # - Recompensas_llaves
   # - RH_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/leviatan/leviatan.bbmodel
  Skills:
    - model{mid=leviatan} @self ~onSpawn
    - skill{s=Leviatan_Rank_Reset} @self ~onSpawn
    - skill{s=Leviatan_Rank_Sumar} @self ~onDamaged
    - skill{s=Leviatan_Rank_Muerte} @self ~onDeath

    - skill{s=LV_Spawn} @self ~onSpawn
    - skill{s=LV_AcquireTarget} @self ~onTimer:10
    - skill{s=LV_HP70_Check} @self ~onTimer:20
    - skill{s=LV_HP40_Check} @self ~onTimer:20
    - skill{s=LV_Phase2_Check} @self ~onTimer:20
    - skill{s=LV_Phase3_Check} @self ~onTimer:20
    - skill{s=LV_Aura} @self ~onTimer:10
    - skill{s=LV_Attack_Rotation} @self ~onTimer:10
    - skill{s=LV_SummonCycle} @self ~onTimer:60
    - skill{s=LV_AntiKite} @self ~onTimer:35
    - skill{s=LV_PlayerKill} @target ~onKill
    - skill{s=LV_Death} @self ~onDeath
    - skill{s=LV_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=LV_Melee} @self ~onAttack
    - skill{s=LV_Hurt} @self ~onDamaged 0.35


