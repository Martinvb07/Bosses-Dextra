# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Leviatan_Combate.yml con summon{type=LV_FX_...}.

LV_FX_Curse:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=lv_fx_curse;hitbox=false} @self ~onSpawn
    - state{mid=lv_fx_curse;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=LV_FX_Remove;delay=32} @self ~onSpawn

