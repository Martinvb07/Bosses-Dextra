# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Azathoth_Combate.yml con summon{type=AZ_FX_...}.

AZ_FX_Blink:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=az_fx_blink;hitbox=false} @self ~onSpawn
    - state{mid=az_fx_blink;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=AZ_FX_Remove;delay=24} @self ~onSpawn

