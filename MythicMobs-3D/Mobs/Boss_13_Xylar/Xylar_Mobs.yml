# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Xylar_Combate.yml con summon{type=XY_FX_...}.

XY_FX_Combo:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=xy_fx_combo;hitbox=false} @self ~onSpawn
    - state{mid=xy_fx_combo;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=XY_FX_Remove;delay=28} @self ~onSpawn

