# Xylar

Xylar:
  Type: WITHER_SKELETON
  Display: "&d&lXYLAR &8• &del Senor Galactico"
  Health: 4000
  Damage: 83
  Armor: 2735
  Faction: Boss_Xylar

  Modules:
    ThreatTable: true

  Equipment:
    - END_ROD:HAND
    - XY_PetoEstelar:CHEST
    - XY_PantalonesEstelar:LEGS
    - XY_BotasEstelar:FEET
    - XY_YelmoEstelar:HEAD

  BossBar:
    Enabled: true
    # \uffa0 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/xylar.yml)
    # es la moldura de metal estelar a cada lado del nombre. No cambies el texto del nombre.
    Title: "&fﾠ&d&lXYLAR&fﾠ"
    Range: 50
    Color: RED
    Style: SOLID

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.80
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>XYLAR 4000 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>XYLAR 4000 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - Ragnarok_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/xylar/xylar.bbmodel
  Skills:
    - model{mid=xylar} @self ~onSpawn
    - skill{s=Xylar_Rank_Reset} @self ~onSpawn
    - skill{s=Xylar_Rank_Sumar} @self ~onDamaged
    - skill{s=Xylar_Rank_Muerte} @self ~onDeath

    - skill{s=XY_Spawn} @self ~onSpawn
    - skill{s=XY_AcquireTarget} @self ~onTimer:10
    - skill{s=XY_HP75_Check} @self ~onTimer:20
    - skill{s=XY_HP50_Check} @self ~onTimer:20
    - skill{s=XY_HP25_Check} @self ~onTimer:20
    - skill{s=XY_HP70_Lore} @self ~onTimer:20
    - skill{s=XY_HP40_Lore} @self ~onTimer:20
    - skill{s=XY_Phase2_Check} @self ~onTimer:20
    - skill{s=XY_Phase3_Check} @self ~onTimer:20
    - skill{s=XY_CondemnedSouls_Check} @self ~onTimer:20
    - skill{s=XY_Execution} @self ~onTimer:10
    - skill{s=XY_Aura} @self ~onTimer:10
    - skill{s=XY_Attack_Rotation} @self ~onTimer:9
    - skill{s=XY_AntiKite} @self ~onTimer:35
    - skill{s=XY_PlayerKill} @target ~onKill
    - skill{s=XY_Death} @self ~onDeath
    - skill{s=XY_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=XY_Melee} @self ~onAttack
    - skill{s=XY_Hurt} @self ~onDamaged 0.35


