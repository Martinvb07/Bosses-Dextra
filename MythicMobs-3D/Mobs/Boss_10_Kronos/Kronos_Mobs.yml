# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Kronos_Combate.yml con summon{type=KR_FX_...}.

KR_FX_Slam:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=kr_fx_slam;hitbox=false} @self ~onSpawn
    - state{mid=kr_fx_slam;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=KR_FX_Remove;delay=24} @self ~onSpawn

