# Kronos

Kronos:
  Type: WITHER_SKELETON
  Display: "&5&lKronos"
  Health: 3400
  Damage: 74
  Armor: 1400
  Faction: Boss_Kronos

  #Modules:
 #   ThreatTable: true

  Equipment:
    - NETHERITE_HOE:HAND
    - KR_PetoTiempo:CHEST
    - KR_PantalonesTiempo:LEGS
    - KR_BotasTiempo:FEET
    - KR_CoronaTiempo:HEAD

  BossBar:
    Enabled: true
    # \u2000 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/kronos.yml)
    # es la moldura de oro a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f &5&lKronos &8• &r&fEl Tirano del Tiempo&f "
    Range: 40
    Color: PURPLE
    Style: SEGMENTED_10

  Options:
    AlwaysShowName: true
    Despawn: false
    PreventOtherDrops: true
    Silent: true
    MovementSpeed: 0.30
    KnockbackResistance: 1
    FollowRange: 40
    PreventSunburn: true
    PreventRandomEquipment: true
    UseThreatTable: true

  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    # Bajado de 25 -> 10: con 25% solo podian calificar 4 personas en teoria,
    # y en la practica el 4to puesto casi nunca llegaba al umbral.
    RequiredDamagePercent: 10
    HologramTimeout: 2000
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>KRONOS 3400 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>KRONOS 3400 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    - Kronos_Nada 1 1
#    - Kronos_Top1{top=1} 1 1
   # - Kronos_Top2{top=2} 1 1
   # - Kronos_Top3{top=3} 1 1
  #  - Kronos_HeroicoConsolacion 1 1
   # - Recompensas_xp
   # - Recompensas_runas
   # - Recompensas_dinero
   # - Recompensas_llaves
   # - OD_EstrellaInvocacion 1 1
   # - command{c="ae givercbook HEROICO <target.name> 3"} 1 1.0

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/kronos/kronos.bbmodel
  Skills:
    - model{mid=kronos} @self ~onSpawn
    - skill{s=Kronos_Rank_Reset} @self ~onSpawn
    - skill{s=Kronos_Rank_Sumar} @self ~onDamaged
    - skill{s=Kronos_Rank_Muerte} @self ~onDeath

    - setstance{stance=PHASE1} @self ~onSpawn
    - skill{s=KR_Intro} @self ~onSpawn
    - skill{s=KR_AcquireTarget} @self ~onTimer:10
    - skill{s=KR_Slam} @target ~onAttack 0.35
    - skill{s=KR_Quake} @target ~onTimer:12 0.40
    - skill{s=KR_RugidoDelTiempo} @self ~onTimer:18 0.35
    - skill{s=KR_Charge} @target ~onTimer:60 0.60
    - skill{s=KR_AntiRun} @self ~onTimer:160
    - skill{s=KR_HP75_Check} @self ~onTimer:20
    - skill{s=KR_HP50_Check} @self ~onTimer:20
    - skill{s=KR_HP25_Check} @self ~onTimer:20
    - skill{s=KR_HP70_Lore} @self ~onTimer:20
    - skill{s=KR_HP40_Lore} @self ~onTimer:20
    - skill{s=KR_Phase2_Check} @self ~onTimer:20
    - skill{s=KR_Phase3_Check} @self ~onTimer:20
    - skill{s=KR_LastBreath} @self ~onTimer:20
    - skill{s=KR_LowHP_Buff} @self ~onTimer:40
    - skill{s=KR_PlayerKill} @target ~onKill
    - skill{s=KR_Death} @self ~onDeath
    - skill{s=KR_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=KR_Melee} @self ~onAttack
    - skill{s=KR_Hurt} @self ~onDamaged 0.35


# --- Subditos de Kronos ---

Kronos_Centinela:
  Type: ZOMBIE
  Display: "&5Centinela del Reloj"
  Health: 1133
  Damage: 15
  Armor: 35
  Faction: Boss_Kronos

  Equipment:
    - IRON_SWORD:HAND
    - CLOCK:OFFHAND
    - KR_CascoCentinela:HEAD

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MovementSpeed: 0.26
    FollowRange: 25

  #Drops:
  AITargetSelectors:
    - clear
    - players

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/kr_sentinel/kr_sentinel.bbmodel
  Skills:
    - model{mid=kr_sentinel} @self ~onSpawn
    - state{mid=kr_sentinel;s=spawn;li=0;lo=2} @self ~onSpawn
    - effect:sound{s=dextra:kronos.sentinel_wind;v=0.8;p=1} @self ~onSpawn
    - state{mid=kr_sentinel;s=attack;li=1;lo=2} @self ~onAttack
    - effect:sound{s=dextra:kronos.sentinel_slash;v=0.8;p=1} @self ~onAttack
    - state{mid=kr_sentinel;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - skill{s=KR_FuegoAmigo;sync=true} @self ~onDamaged


