Ragnarok:
  Type: STRAY
  Display: "&b&lRAGNAROK"
  Title: "&b&lRAGNAROK &7- &f<mob.hp{round=0}> &bICE"
  Health: 2650
  Damage: 62
  Armor: 2735
  Faction: Boss_Ragnarok

  Equipment:
    - DIAMOND_AXE:HAND
    - Ragnarok_IronChestplate:CHEST
    - Ragnarok_IronLeggings:LEGS
    - Ragnarok_IronBoots:FEET
    - "PLAYER_HEAD{skullTexture=eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMmI4MmRkYTQ1NmZjZTg2YTA4Y2RiZjViOGQ3OWJjMGU0NTU2MzA3YWEzZGY0NmY4ZjljNTVmNzVlMzVhMjM3YyJ9fX0=}:HEAD"

  BossBar:
    Enabled: true
    # \u2007 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/ragnarok.yml)
    # es la moldura nordica a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2007&b&lRAGNAROK&f\u2007"
    Range: 50
    Color: BLUE
    Style: SEGMENTED_10

  Options:
    AlwaysShowName: true
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.80
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - MH_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/ragnarok/ragnarok.bbmodel
  Skills:
    - model{mid=ragnarok} @self ~onSpawn
    - skill{s=Ragnarok_Spawn} @self ~onSpawn
    - skill{s=Ragnarok_AcquireTarget} @self ~onTimer:10
    - skill{s=Ragnarok_HP75_Check} @self ~onTimer:20
    - skill{s=Ragnarok_HP50_Check} @self ~onTimer:20
    - skill{s=Ragnarok_HP25_Check} @self ~onTimer:20
    - skill{s=Ragnarok_Phase2_Check} @self ~onTimer:20
    - skill{s=Ragnarok_Phase3_Check} @self ~onTimer:20
    - skill{s=Ragnarok_Phase4_Check} @self ~onTimer:20
    - skill{s=Ragnarok_FreezeAura} @self ~onTimer:10
    - skill{s=Ragnarok_Attack_Rotation} @self ~onTimer:9
    - skill{s=Ragnarok_AntiKite} @self ~onTimer:35
    - skill{s=Ragnarok_DevastatingBlow} @target ~onAttack 0.35
    - skill{s=Ragnarok_PlayerKill} @target ~onKill
    - skill{s=Ragnarok_Death} @self ~onDeath
    - skill{s=Ragnarok_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=Ragnarok_Hurt} @self ~onDamaged 0.35
    - skill{s=Ragnarok_Melee} @self ~onAttack

