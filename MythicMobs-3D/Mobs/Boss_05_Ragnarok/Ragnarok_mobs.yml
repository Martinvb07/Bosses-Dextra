# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde ragnarok_skills.yml con summon{type=RG_FX_...}.

RG_FX_Shatter:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=rg_fx_shatter;hitbox=false} @self ~onSpawn
    - state{mid=rg_fx_shatter;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=Ragnarok_FX_Remove;delay=20} @self ~onSpawn

