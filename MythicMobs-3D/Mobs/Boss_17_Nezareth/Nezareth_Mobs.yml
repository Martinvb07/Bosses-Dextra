# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Nezareth_Combate.yml con summon{type=NZ_FX_...}.

NZ_FX_Tug:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=nz_fx_tug;hitbox=false} @self ~onSpawn
    - state{mid=nz_fx_tug;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=NZ_FX_Remove;delay=32} @self ~onSpawn

