# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde lady_of_laments_skills.yml con summon{type=LL_FX_...}.

LL_FX_Wail:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=ll_fx_wail;hitbox=false} @self ~onSpawn
    - state{mid=ll_fx_wail;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=LL_FX_Remove;delay=26} @self ~onSpawn

