# Lady of Laments + Banshee + Shadow + Tormented Spirit

LadyOfLaments:
  Type: EVOKER
  Display: "&5&lLADY OF LAMENTS &8• &dReina del Lamento Eterno"
  Health: 2950
  Damage: 68
  Armor: 4274
  Faction: Boss_LadyOfLaments
  Equipment:
    - LadyOfLaments_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    # \u2009 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/lady_of_laments.yml)
    # es la moldura gotica a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2009&5&lLADY OF LAMENTS&f\u2009"
    Range: 50
    Color: PURPLE
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.29
    FollowRange: 40
    KnockbackResistance: 0.68
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - YT_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/lady_of_laments/lady_of_laments.bbmodel
  Skills:
    - model{mid=lady_of_laments} @self ~onSpawn
    - skill{s=LL_Spawn} @self ~onSpawn
    - skill{s=LL_AcquireTarget} @self ~onTimer:10
    - skill{s=LL_HP70_Check} @self ~onTimer:20
    - skill{s=LL_HP40_Check} @self ~onTimer:20
    - skill{s=LL_Phase2_Check} @self ~onTimer:20
    - skill{s=LL_Phase3_Check} @self ~onTimer:20
    - skill{s=LL_Phase4_Check} @self ~onTimer:20
    - skill{s=LL_Aura} @self ~onTimer:10
    - skill{s=LL_Attack_Rotation} @self ~onTimer:10
    - skill{s=LL_SummonCycle} @self ~onTimer:70
    - skill{s=LL_BansheeChorus} @self ~onTimer:40
    - skill{s=LL_AntiKite} @self ~onTimer:35
    - skill{s=LL_PlayerKill} @target ~onKill
    - skill{s=LL_Death} @self ~onDeath
    - skill{s=LL_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=LL_InmuneColmillos;sync=true} @self ~onDamaged
    - skill{s=LL_Hurt} @self ~onDamaged 0.35

BansheeOfLaments:
  Type: VEX
  Display: "&dBanshee del lamento"
  Health: 84
  Damage: 12
  Faction: Boss_LadyOfLaments

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.34
    FollowRange: 28

  AITargetSelectors:
    - clear
    - players

  Drops:
    #- Recompensas_BansheeOfLaments

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/banshee/banshee.bbmodel
  Skills:
    - model{mid=banshee} @self ~onSpawn
    - state{mid=banshee;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - skill{s=BL_SpawnFX} @self ~onSpawn
    - skill{s=BL_Wail} @target ~onAttack
    - skill{s=LL_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=LL_InmuneColmillos;sync=true} @self ~onDamaged

