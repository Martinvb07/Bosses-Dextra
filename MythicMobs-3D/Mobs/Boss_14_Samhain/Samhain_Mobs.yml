Samhain:
  Type: STRAY
  Display: "&6&lSAMHAIN &8• &6el Senor de las Animas"
  Title: "&6&lSAMHAIN &7- &f<mob.hp{round=0}> &6ALMA"
  Health: 4200
  Damage: 86
  Armor: 2735
  Faction: Boss_Samhain

  Modules:
    ThreatTable: true

  Equipment:
    - DIAMOND_HOE:HAND
    - SH_TunicaAnimas:CHEST
    - SH_PantalonesAnimas:LEGS
    - SH_BotasAnimas:FEET
    - JACK_O_LANTERN:HEAD

  BossBar:
    Enabled: true
    # \u202f no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/samhain.yml)
    # es la moldura de madera y calabazas a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f &6&lSAMHAIN&f "
    Range: 50
    Color: BLUE
    Style: SEGMENTED_10

  Options:
    AlwaysShowName: true
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.80
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>SAMHAIN 4200 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>SAMHAIN 4200 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    - Samhain_Nada 1 1
   # - Recompensas_xp
   # - Recompensas_runas
   # - Recompensas_dinero
   # - Recompensas_llaves
   # - MH_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/samhain/samhain.bbmodel
  Skills:
    - model{mid=samhain} @self ~onSpawn
    - skill{s=Samhain_Rank_Reset} @self ~onSpawn
    - skill{s=Samhain_Rank_Sumar} @self ~onDamaged
    - skill{s=Samhain_Rank_Muerte} @self ~onDeath

    - skill{s=SH_Spawn} @self ~onSpawn
    - skill{s=SH_AcquireTarget} @self ~onTimer:10
    - skill{s=SH_HP75_Check} @self ~onTimer:20
    - skill{s=SH_HP50_Check} @self ~onTimer:20
    - skill{s=SH_HP25_Check} @self ~onTimer:20
    - skill{s=SH_Phase2_Check} @self ~onTimer:20
    - skill{s=SH_Phase3_Check} @self ~onTimer:20
    - skill{s=SH_Phase4_Check} @self ~onTimer:20
    - skill{s=SH_FreezeAura} @self ~onTimer:10
    - skill{s=SH_Attack_Rotation} @self ~onTimer:9
    - skill{s=SH_AntiKite} @self ~onTimer:35
    - skill{s=SH_DevastatingBlow} @target ~onAttack 0.35
    - skill{s=SH_PlayerKill} @target ~onKill
    - skill{s=SH_Death} @self ~onDeath
    - skill{s=SH_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=SH_Melee} @self ~onAttack
    - skill{s=SH_Hurt} @self ~onDamaged 0.35


# --- Subditos de Samhain ---

Samhain_Espantapajaros:
  Type: ZOMBIE
  Display: "&6Espantapajaros Maldito"
  Health: 1400
  Damage: 17
  Armor: 85
  Faction: Boss_Samhain

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MovementSpeed: 0.24
    FollowRange: 28

  Equipment:
    - IRON_HOE:HAND
    - SH_CamisaEspantapajaros:CHEST
    - SH_PantalonEspantapajaros:LEGS
    - SH_BotasEspantapajaros:FEET
    - CARVED_PUMPKIN:HEAD

  AITargetSelectors:
    - clear
    - players

  Drops:
    #- Recompensas_Draugr_Ragnarok

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/sh_scarecrow/sh_scarecrow.bbmodel
  Skills:
    - model{mid=sh_scarecrow} @self ~onSpawn
    - state{mid=sh_scarecrow;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - state{mid=sh_scarecrow;s=spawn;li=0;lo=2} @self ~onSpawn
    - effect:sound{s=dextra:samhain.scarecrow_rustle;v=0.8;p=1} @self ~onSpawn
    - state{mid=sh_scarecrow;s=attack;li=1;lo=2} @self ~onAttack
    - effect:sound{s=dextra:samhain.scarecrow_stab;v=0.8;p=1} @self ~onAttack
    - skill{s=SH_Draugr_Resilience} @self ~onSpawn
    - skill{s=SH_Draugr_Resilience} @self ~onTimer:80
    - skill{s=SH_FuegoAmigo;sync=true} @self ~onDamaged

