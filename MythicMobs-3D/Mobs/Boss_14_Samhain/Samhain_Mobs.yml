# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Samhain_Combate.yml con summon{type=SH_FX_...}.

SH_FX_Reap:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=sh_fx_reap;hitbox=false} @self ~onSpawn
    - state{mid=sh_fx_reap;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=SH_FX_Remove;delay=16} @self ~onSpawn

