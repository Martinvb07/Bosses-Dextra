# RedHand + FallenSquire + RH_BloodPool

RedHand:
  Type: WITHER_SKELETON
  Display: "&4&lRED HAND &8• &8Fallen Dark Knight"
  Health: 2500
  Damage: 59
  Armor: 2735
  Faction: Boss_RedHand

  Equipment:
    - NETHERITE_SWORD:HAND
    - RH_PetoNetherita:CHEST
    - RH_PantalonesNetherita:LEGS
    - RH_BotasNetherita:FEET
    - "PLAYER_HEAD{skullTexture=eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTI4ZDJlZGYwZTlhMTFhNDkyZDM2YjU3ZjkyM2U5M2E2MGU4MDQ4NjM3MmIyNGZmMGY1MmY0NjBiZDM5YjlkNiJ9fX0=}:HEAD"

  BossBar:
    Enabled: true
    # \u2006 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/red_hand.yml)
    # es la moldura gotica a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2006&4&lRED HAND&f\u2006"
    Range: 50
    Color: RED
    Style: SOLID

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.80
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - Ragnarok_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/red_hand/red_hand.bbmodel
  Skills:
    - model{mid=red_hand} @self ~onSpawn
    - skill{s=RH_Spawn} @self ~onSpawn
    - skill{s=RH_AcquireTarget} @self ~onTimer:10
    - skill{s=RH_HP75_Check} @self ~onTimer:20
    - skill{s=RH_HP50_Check} @self ~onTimer:20
    - skill{s=RH_HP25_Check} @self ~onTimer:20
    - skill{s=RH_HP70_Lore} @self ~onTimer:20
    - skill{s=RH_HP40_Lore} @self ~onTimer:20
    - skill{s=RH_Phase2_Check} @self ~onTimer:20
    - skill{s=RH_Phase3_Check} @self ~onTimer:20
    - skill{s=RH_CondemnedSouls_Check} @self ~onTimer:20
    - skill{s=RH_Execution} @self ~onTimer:10
    - skill{s=RH_Aura} @self ~onTimer:10
    - skill{s=RH_Attack_Rotation} @self ~onTimer:9
    - skill{s=RH_AntiKite} @self ~onTimer:35
    - skill{s=RH_PlayerKill} @target ~onKill
    - skill{s=RH_Death} @self ~onDeath
    - skill{s=RH_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=RH_Hurt} @self ~onDamaged 0.35
    - skill{s=RH_Melee} @self ~onAttack

