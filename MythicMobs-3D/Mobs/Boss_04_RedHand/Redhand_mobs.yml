# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde redhand_skills.yml con summon{type=RH_FX_...}.

RH_FX_Slash:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=rh_fx_slash;hitbox=false} @self ~onSpawn
    - state{mid=rh_fx_slash;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=RH_FX_Remove;delay=10} @self ~onSpawn

