# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde Thor_Combate.yml con summon{type=TH_FX_...}.

TH_FX_Swing:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=th_fx_swing;hitbox=false} @self ~onSpawn
    - state{mid=th_fx_swing;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=TH_FX_Remove;delay=16} @self ~onSpawn

