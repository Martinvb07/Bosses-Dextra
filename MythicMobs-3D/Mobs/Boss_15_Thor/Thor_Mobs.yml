# Thor

Thor:
  Type: ZOMBIE
  Display: "&b&lTHOR &8• &eel Dios del Trueno"
  Health: 4400
  Damage: 89
  Armor: 3419
  Faction: Boss_Thor

  Modules:
    ThreatTable: true

  Equipment:
    - MACE:HAND
    - TH_PetoTrueno:CHEST
    - TH_PantalonesTrueno:LEGS
    - TH_BotasTrueno:FEET
    - TH_CascoAlado:HEAD

  BossBar:
    Enabled: true
    # \xa0 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/thor.yml)
    # es la moldura de acero y rayos a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f &b&lTHOR&f "
    Range: 50
    Color: BLUE
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.31
    FollowRange: 40
    KnockbackResistance: 0.78
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>THOR 4400 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>THOR 4400 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    - Thor_Nada 1 1
   # - Recompensas_xp
   # - Recompensas_runas
   # - Recompensas_dinero
   # - Recompensas_llaves
   # - LL_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/thor/thor.bbmodel
  Skills:
    - model{mid=thor} @self ~onSpawn
    - skill{s=Thor_Rank_Reset} @self ~onSpawn
    - skill{s=Thor_Rank_Sumar} @self ~onDamaged
    - skill{s=Thor_Rank_Muerte} @self ~onDeath

    - skill{s=TH_Spawn} @self ~onSpawn
    - skill{s=TH_AcquireTarget} @self ~onTimer:10
    - skill{s=TH_HP70_Check} @self ~onTimer:20
    - skill{s=TH_HP40_Check} @self ~onTimer:20
    - skill{s=TH_HP25_Check} @self ~onTimer:20
    - skill{s=TH_Phase2_Check} @self ~onTimer:20
    - skill{s=TH_Phase3_Check} @self ~onTimer:20
    - skill{s=TH_Phase4_Check} @self ~onTimer:20
    - skill{s=TH_Aura} @self ~onTimer:10
    - skill{s=TH_Attack_Rotation} @self ~onTimer:9
    - skill{s=TH_FungalRegrowth} @self ~onTimer:40
    - skill{s=TH_SummonCycle} @self ~onTimer:65
    - skill{s=TH_MapPressure} @self ~onTimer:50
    - skill{s=TH_PlagueApocalypse_Check} @self ~onTimer:45
    - skill{s=TH_AntiKite} @self ~onTimer:35
    - skill{s=TH_ToxicTouch} @target ~onAttack 0.60
    - skill{s=TH_PlayerKill} @target ~onKill
    - skill{s=TH_Death} @self ~onDeath
    - skill{s=TH_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=TH_Melee} @self ~onAttack
    - skill{s=TH_Hurt} @self ~onDamaged 0.35


