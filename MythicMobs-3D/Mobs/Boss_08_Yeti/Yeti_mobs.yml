# Yeti + secuaces de hielo

Yeti:
  Type: SKELETON
  Display: "&b&lYETI &8• &fBestia del Invierno Eterno"
  Health: 3200
  Damage: 71
  Armor: 6679
  Faction: Boss_Yeti
  Equipment:
    - Yeti_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    # \u200a no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/yeti.yml)
    # es la moldura de hielo a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f &b&lYETI&f "
    Range: 55
    Color: BLUE
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 42
    KnockbackResistance: 0.85
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/yeti/yeti.bbmodel
  Skills:
    - model{mid=yeti} @self ~onSpawn
    - skill{s=Yeti_Spawn} @self ~onSpawn
    - skill{s=Yeti_AcquireTarget} @self ~onTimer:10
    - skill{s=Yeti_HP70_Check} @self ~onTimer:20
    - skill{s=Yeti_HP40_Check} @self ~onTimer:20
    - skill{s=Yeti_Phase2_Check} @self ~onTimer:20
    - skill{s=Yeti_Phase3_Check} @self ~onTimer:20
    - skill{s=Yeti_SubjugationShield} @self ~onTimer:10
    - skill{s=Yeti_FrozenAura} @self ~onTimer:12
    - skill{s=Yeti_SnowPresence} @self ~onTimer:8
    - skill{s=Yeti_Roar} @self ~onTimer:80
    - skill{s=Yeti_Attack_Rotation} @self ~onTimer:10
    - skill{s=Yeti_SummonCycle} @self ~onTimer:55
    - skill{s=Yeti_AntiKite} @self ~onTimer:35
    - skill{s=Yeti_PlayerKill} @target ~onKill
    - skill{s=Yeti_Death} @self ~onDeath
    - skill{s=Yeti_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=Yeti_Melee} @self ~onAttack
    - skill{s=Yeti_Hurt} @self ~onDamaged 0.35

FrostBrute_Yeti:
  Type: HUSK
  Display: "&bBruto de escarcha"
  Health: 682
  Damage: 14
  Armor: 2226
  Faction: Boss_Yeti

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 30

  Equipment:
    - STONE_AXE:HAND

  AITargetSelectors:
    - clear
    - players

  Drops:
    #- Recompensas_FrostBrute_Yeti

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/frost_brute/frost_brute.bbmodel
  Skills:
    - model{mid=frost_brute} @self ~onSpawn
    - state{mid=frost_brute;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - skill{s=FBY_SpawnFX} @self ~onSpawn
    - skill{s=FBY_FrozenMaul} @target ~onAttack
    - skill{s=Yeti_FuegoAmigo;sync=true} @self ~onDamaged

