# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde baal_skills.yml con summon{type=BL_FX_...}.

BL_FX_Seal:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=bl_fx_seal;hitbox=false} @self ~onSpawn
    - state{mid=bl_fx_seal;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=Baal_FX_Remove;delay=24} @self ~onSpawn

