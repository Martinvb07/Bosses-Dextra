# Baal + Samurai + Yokai + Shadow Ninja

Baal:
  Type: SKELETON
  Display: "&d&lBAAL &8• &5Espiritu del Templo Sakura"
  Health: 2350
  Damage: 56
  Armor: 1750
  Faction: Boss_Baal

  Equipment:
    - NETHERITE_SWORD:HAND
    - Baal_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    # \u2005 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/baal.yml)
    # es la moldura japonesa a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2005&d&lBAAL&f\u2005"
    Range: 50
    Color: PINK
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.65
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - RH_EstrellaInvocacion 1 1

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/baal/baal.bbmodel
  Skills:
    - model{mid=baal} @self ~onSpawn
    - skill{s=Baal_Spawn} @self ~onSpawn
    - skill{s=Baal_AcquireTarget} @self ~onTimer:10
    - skill{s=Baal_HP70_Check} @self ~onTimer:20
    - skill{s=Baal_HP40_Check} @self ~onTimer:20
    - skill{s=Baal_Phase2_Check} @self ~onTimer:20
    - skill{s=Baal_Phase3_Check} @self ~onTimer:20
    - skill{s=Baal_Aura} @self ~onTimer:10
    - skill{s=Baal_Attack_Rotation} @self ~onTimer:10
    - skill{s=Baal_SummonCycle} @self ~onTimer:60
    - skill{s=Baal_AntiKite} @self ~onTimer:35
    - skill{s=Baal_PlayerKill} @target ~onKill
    - skill{s=Baal_Death} @self ~onDeath
    - skill{s=Baal_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=Baal_Hurt} @self ~onDamaged 0.35
    - skill{s=Baal_Melee} @self ~onAttack

UndeadSamurai:
  Type: WITHER_SKELETON
  Display: "&7Samurai no muerto"
  Health: 104
  Damage: 14
  Armor: 3
  Faction: Boss_Baal

  Equipment:
    - IRON_SWORD:HAND

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    MovementSpeed: 0.28
    FollowRange: 28

  AITargetSelectors:
    - clear
    - players

  Drops:
    #- Recompensas_UndeadSamurai

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/undead_samurai/undead_samurai.bbmodel
  Skills:
    - model{mid=undead_samurai} @self ~onSpawn
    - state{mid=undead_samurai;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - skill{s=US_SpawnFX} @self ~onSpawn
    - skill{s=US_KatanaBlock} @target ~onAttack
    - skill{s=Baal_FuegoAmigo;sync=true} @self ~onDamaged

