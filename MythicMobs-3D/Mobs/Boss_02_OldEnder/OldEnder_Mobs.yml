# --- Efectos de los ataques (solo version 3D) ---
# Mobs invisibles que llevan un modelo de ModelEngine con su animacion "play" y se borran solos.
# Se invocan desde old_ender_skills.yml con summon{type=OD_FX_...}.

OD_FX_Portal:
  Type: ARMOR_STAND
  Display: " "
  Health: 1
  Options:
    Invisible: true
    Invincible: true
    Marker: true
    HasGravity: false
    Silent: true
    Despawn: true
    PreventOtherDrops: true
    Collidable: false
  Skills:
    - model{mid=oe_fx_portal;hitbox=false} @self ~onSpawn
    - state{mid=oe_fx_portal;s=play;li=0;lo=0} @self ~onSpawn
    - skill{s=OD_FX_Remove;delay=26} @self ~onSpawn

