OldEnder:
  Type: ENDERMAN
  Display: "&5&lOLD ENDER"
  Health: 2200
  Damage: 53
  Armor: 1750
  Faction: Boss_OldEnder
  Equipment:
    - OldEnder_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    # \u2004 no se ve en vanilla; con el pack (ItemsAdder: dextra_bosses/old_ender.yml)
    # es la moldura egipcia a cada lado del nombre. No cambies el texto del nombre.
    Title: "&f\u2004&5&lOLD ENDER&f\u2004"
    Range: 60
    Color: PURPLE
    Style: SOLID

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventTeleport: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 60
    KnockbackResistance: 1.0
    UseThreatTable: true
    Collidable: true

  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget
    - LookAtTarget
    - randomlookaround

  DamageModifiers:
    - FIRE 0
    - FIRE_TICK 0
    - LAVA 0
    - HOT_FLOOR 0

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - Baal_EstrellaInvocacion 1 1

  Modules:
    ImmunityTable: true
  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/old_ender/old_ender.bbmodel
  Skills:
    - model{mid=old_ender} @self ~onSpawn
    - skill{s=OD_Spawn} @self ~onSpawn
    - skill{s=OD_AcquireTarget} @self ~onTimer:10
    - skill{s=OD_HP75_Check} @self ~onTimer:20
    - skill{s=OD_HP50_Check} @self ~onTimer:20
    - skill{s=OD_HP25_Check} @self ~onTimer:20
    - skill{s=OD_HP70_Lore} @self ~onTimer:20
    - skill{s=OD_HP40_Lore} @self ~onTimer:20
    - skill{s=OD_Phase2_Check} @self ~onTimer:20
    - skill{s=OD_Phase3_Check} @self ~onTimer:20
    - skill{s=OD_Phase4_Check} @self ~onTimer:20
    - skill{s=OD_DesertSummons_Check} @self ~onTimer:20
    - skill{s=OD_IntenseSandstorm_Check} @self ~onTimer:20
    - skill{s=OD_EnderPresence} @self ~onTimer:12
    - skill{s=OD_KeepFight} @self ~onTimer:40
    - skill{s=OD_Attack_Rotation} @self ~onTimer:55
    - skill{s=OD_PlayerKill} @target ~onKill
    - skill{s=OD_Death} @self ~onDeath
    - skill{s=OD_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=OD_Hurt} @self ~onDamaged 0.35
    - skill{s=OD_Melee} @self ~onAttack

