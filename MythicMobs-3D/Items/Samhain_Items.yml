# Samhain - Sacos de recompensa por puesto en el ranking de dano.
# Click derecho -> ver Skills/Samhain_Skills.yml
# El puesto ya viene decidido en el item, asi que cada saco entrega siempre lo mismo.

Saco_Samhain_Top1:
  Id: YELLOW_DYE
  Display: "&6&lSaco de Samhain &8• &e&l1er Lugar"
  Lore:
    - "&7Calabazas malditas llenas de botin,"
    - "&7para quien apago su ultima vela."
    - ""
    - "&eClick derecho &7para abrirlo."
    - ""
    - "&8Recompensa de &6&lSAMHAIN"
  Skills:
    - skill{s=Samhain_Saco_Top1} @Self ~onRightClick

