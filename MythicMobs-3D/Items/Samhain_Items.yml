# Estrella de invocacion -> skill SH_ItemSummon en Skills/Samhain_Combate.yml
Samhain_EstrellaInvocacion:
  Id: NETHER_STAR
  Display: "&6&lEstrella de invocacion"
  Lore:
    - "&7Click derecho sobre el altar para invocar a &6&lSAMHAIN&7."
    - "&8(Usala en su altar de /warp bosses)"
  Options:
    Glowing: true
  Skills:
    - skill{s=SH_ItemSummon} @Self ~onRightClick
    - skill{s=SH_ItemSummon} @Self ~onUse

