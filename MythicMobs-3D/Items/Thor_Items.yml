# Thor - Sacos de recompensa por puesto en el ranking de dano.
# Click derecho -> ver Skills/Thor_Skills.yml
# El puesto ya viene decidido en el item, asi que cada saco entrega siempre lo mismo.

Saco_Thor_Top1:
  Id: YELLOW_DYE
  Display: "&b&lSaco de Thor &8• &e&l1er Lugar"
  Lore:
