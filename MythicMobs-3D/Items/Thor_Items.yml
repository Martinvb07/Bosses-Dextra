# Estrella de invocacion -> skill TH_ItemSummon en Skills/Thor_Combate.yml
Thor_EstrellaInvocacion:
  Id: NETHER_STAR
  Display: "&b&lEstrella de invocacion"
  Lore:
    - "&7Click derecho sobre el altar para invocar a &b&lTHOR&7."
    - "&8(Usala en su altar de /warp bosses)"
  Options:
    Glowing: true
  Skills:
    - skill{s=TH_ItemSummon} @Self ~onRightClick
    - skill{s=TH_ItemSummon} @Self ~onUse

