# Rotacion de los bosses 10-17 (generado por tools/generate_ce_bosses.py; no lo edites a mano)
# Lugar: Warps 60053.5 73 60059.5
# En cada turno se retira el boss anterior si sigue vivo y aparece el siguiente.
# Es un solo evento que mira la hora una vez por minuto con un unico placeholder. Con un evento
