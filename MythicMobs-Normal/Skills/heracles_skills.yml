    - damage{a=40} @PlayersInRadius{r=5}
    - throw{velocity=6;velocityY=2} @PlayersInRadius{r=5}
    - potion{type=SLOW;duration=60;level=1} @PlayersInRadius{r=5}

Heracles_Charge:
  Cooldown: 8
  Conditions:
    - stance{stance=PHASE2} true
  Skills:
    - effect:sound{s=entity.ravager.roar;v=0.7;p=1.0} @self
