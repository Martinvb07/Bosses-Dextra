  Cooldown: 15
  Conditions:
    - targetwithin{d=20} true
  Skills:
    - effect:sound{s=entity.iron_golem.attack;v=0.8;p=0.6} @self
    - effect:particles{particle=BLOCK_CRACK;material=STONE;amount=120;hS=2.3;vS=0.2;speed=0.12} @self
    - delay 6
    - damage{a=40} @PlayersInRadius{r=8}
    - throw{velocity=4;velocityY=1.2} @PlayersInRadius{r=8}
    - potion{type=WEAKNESS;duration=80;level=1} @PlayersInRadius{r=8}

Heracles_OlympusRoar:
  Cooldown: 25
  Skills:
    - effect:sound{s=entity.ender_dragon.growl;v=0.7;p=0.9} @self
