Heracles_ItemSummon:
  Conditions:
    - skilloncooldown{skill=Heracles_ItemSummon_AtCoords} castinstead Heracles_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast Heracles_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=732.5;y=76;z=-831.5;world=Spawn;distance=<6} orElseCast Heracles_ItemSummon_Fail_NotAtSpot
  Skills:
    - skill{s=Heracles_ItemSummon_AtCoords} @Location{x=732.5;y=76;z=-831.5;world=Spawn}

Heracles_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=Heracles;amount=<1;r=100} orElseCast Heracles_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=1.05} @self
    - effect:particles{particle=TOTEM;amount=24;hS=0.8;vS=0.8;speed=0.03} @targetlocation{y=0.2}
    - delay 8
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=Heracles;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumeuseditem{a=1} @self
    - message{cooldown=2;m="&6&lHERACLES &8» &aInvocado."} @self

Heracles_ItemSummon_Fail_AlreadyActive:
  Skills:
    - message{cooldown=2;m="&6&lHERACLES &8» &7Ya hay un &6Heracles &7cerca. Mata al boss antes de invocar otro."} @self

Heracles_ItemSummon_Fail_WrongWorld:
  Skills:
    - message{cooldown=2;m="&6&lHERACLES &8» &eLa invocacion no responde en este lugar. &7Regresa al &6Altar de Invocacion&7."} @self

Heracles_ItemSummon_Fail_NotAtSpot:
  Skills:
    - message{cooldown=2;m="&6&lHERACLES &8» &eNo estas en el &6Altar de Invocacion&e. &7Acercate al altar para usar la estrella."} @self

Heracles_ItemSummon_Fail_Cooldown:
  Skills:
    - message{cooldown=2;m="&6&lHERACLES &8» &7La estrella aun se esta recargando. &fEspera un momento&7."} @self

# --- Fuego amigo ---
Heracles_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_Heracles} true
  Skills:
    - cancelevent @self
