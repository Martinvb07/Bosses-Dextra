# Thor - Skills de combate PROPIAS (antes usaba las de Mushlord tal cual).
# Mecanicas basadas en Mushlord, con lore, subditos y particulas de Thor.
# Daño de skills escalado x0.97 y umbrales de vida para 4400 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

TH_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&b&lTHOR";subtitle="&eCumbre de Asgard &8• &7El Dios del Trueno desciende";fadein=20;stay=300;duration=300;fadeout=20} @Server'
    - 'message{m="&b&lTHOR &f: &7¿Osais desafiar al hijo de Odin? ¡Que retumbe el cielo!"} @Server'
    - effect:sound{s=entity.zombie_villager.converted;v=0.7;p=0.7} @self
    - effect:particles{particle=ELECTRIC_SPARK;amount=28;hS=1.0;vS=0.6;speed=0.02} @self
    - effect:particles{particle=REDSTONE;amount=40;hS=1.2;vS=1.0;speed=0.0;color=#ffe066;size=1.3} @self
    - effect:particles{particle=ELECTRIC_SPARK;amount=18;hS=1.0;vS=0.8;speed=0.02} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

