# Kukulkan

Kukulkan:
  Type: EVOKER
  Display: "&a&lKUKULKAN &8• &ala Serpiente Solar"
  Health: 4600
  Damage: 92
  Armor: 4274
  Faction: Boss_Kukulkan
  Modules:
    ThreatTable: true

  Equipment:
    - KK_ArmaduraInvisible:CHEST

  BossBar:
    Enabled: true
    Title: "&a&lKUKULKAN"
    Range: 50
    Color: PURPLE
    Style: SEGMENTED_10

  Options:
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.29
    FollowRange: 40
    KnockbackResistance: 0.68
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>KUKULKAN 4600 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>KUKULKAN 4600 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    # Mismo sistema que los bosses 01-07: xp, runas, dinero y llaves (DropTables/Recompensas_Bosses).
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves

  Skills:
    - skill{s=Kukulkan_Rank_Reset} @self ~onSpawn
    - skill{s=Kukulkan_Rank_Sumar} @self ~onDamaged
    - skill{s=Kukulkan_Rank_Muerte} @self ~onDeath

    - skill{s=KK_Spawn} @self ~onSpawn
    - skill{s=KK_AcquireTarget} @self ~onTimer:10
    - skill{s=KK_HP70_Check} @self ~onTimer:20
    - skill{s=KK_HP40_Check} @self ~onTimer:20
    - skill{s=KK_Phase2_Check} @self ~onTimer:20
    - skill{s=KK_Phase3_Check} @self ~onTimer:20
    - skill{s=KK_Phase4_Check} @self ~onTimer:20
    - skill{s=KK_Aura} @self ~onTimer:10
    - skill{s=KK_Attack_Rotation} @self ~onTimer:10
    - skill{s=KK_SummonCycle} @self ~onTimer:70
    - skill{s=KK_BansheeChorus} @self ~onTimer:40
    - skill{s=KK_AntiKite} @self ~onTimer:35
    - skill{s=KK_PlayerKill} @target ~onKill
    - skill{s=KK_Death} @self ~onDeath
    - skill{s=KK_FuegoAmigo;sync=true} @self ~onDamaged
    - skill{s=KK_InmuneColmillos;sync=true} @self ~onDamaged


