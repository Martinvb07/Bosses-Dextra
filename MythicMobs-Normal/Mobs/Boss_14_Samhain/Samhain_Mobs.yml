Samhain:
  Type: STRAY
  Display: "&6&lSAMHAIN &8• &6el Senor de las Animas"
  Title: "&6&lSAMHAIN &7- &f<mob.hp{round=0}> &6ALMA"
  Health: 4200
  Damage: 86
  Armor: 2735
  Faction: Boss_Samhain

  Modules:
    ThreatTable: true

  Equipment:
    - DIAMOND_HOE:HAND
    - SH_TunicaAnimas:CHEST
    - SH_PantalonesAnimas:LEGS
    - SH_BotasAnimas:FEET
    - JACK_O_LANTERN:HEAD

  BossBar:
    Enabled: true
    Title: "&6&lSAMHAIN"
    Range: 50
    Color: BLUE
    Style: SEGMENTED_10

  Options:
    AlwaysShowName: true
    Despawn: false
    PreventOtherDrops: true
    PreventBlockBreak: true
    PreventRandomEquipment: true
    Silent: false
    MovementSpeed: 0.30
    FollowRange: 40
    KnockbackResistance: 0.80
    PreventSunburn: true
    UseThreatTable: true

  AITargetSelectors:
    - clear
    - players

  DropOptions:
    DropMethod: FANCY
    ShowDeathChatMessage: true
    ShowDeathHologram: true
    PerPlayerDrops: true
    ClientSideDrops: true
    Lootsplosion: true
    HologramItemNames: true
    ItemGlowByDefault: true
    ItemBeamByDefault: true
    ItemVFXByDefault: false
    RequiredDamagePercent: 25
    HologramTimeout: 15
    HologramMessage:
      - "<#F2B600>========================"
      - "<#FFD600>SAMHAIN 4200 HP"
      - ""
      - "<#FFA300>1er Lugar | <1.name> | <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> | <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> | <3.damage>"
      - ""
      - "Posicion: #<player.rank> | <player.damage>"
      - "<#F2B600>========================"
    ChatMessage:
      - "<#F2B600>===================================="
      - "<#FFD600>JEFE DERROTADO!"
      - "<#FFD600>SAMHAIN 4200 HP"
      - ""
      - "<#ffe259>1er Lugar | <1.name> - <1.damage>"
      - "<#D1FFFF>2do Lugar | <2.name> - <2.damage>"
      - "<#D1FFFF>3ro Lugar | <3.name> - <3.damage>"
      - ""
      - "<#F2B600>Posicion: #<player.rank> - <player.damage>"
      - "<#F2B600>===================================="

  Drops:
    # Tablas propias de los bosses 10-17 (hoja Warp_Bosses): DropTables/Recompensas_Bosses_Warp/
    - Recompensas_Warp_xp
    - Recompensas_Warp_runas
    - Recompensas_Warp_dinero
    - Recompensas_Warp_llaves

  Skills:
    - skill{s=Samhain_Rank_Reset} @self ~onSpawn
    - skill{s=Samhain_Rank_Sumar} @self ~onDamaged
    - skill{s=Samhain_Rank_Muerte} @self ~onDeath

    - skill{s=SH_Spawn} @self ~onSpawn
    - skill{s=SH_AcquireTarget} @self ~onTimer:10
    - skill{s=SH_HP75_Check} @self ~onTimer:20
    - skill{s=SH_HP50_Check} @self ~onTimer:20
    - skill{s=SH_HP25_Check} @self ~onTimer:20
    - skill{s=SH_Phase2_Check} @self ~onTimer:20
    - skill{s=SH_Phase3_Check} @self ~onTimer:20
    - skill{s=SH_Phase4_Check} @self ~onTimer:20
    - skill{s=SH_FreezeAura} @self ~onTimer:10
    - skill{s=SH_Attack_Rotation} @self ~onTimer:9
    - skill{s=SH_AntiKite} @self ~onTimer:35
    - skill{s=SH_DevastatingBlow} @target ~onAttack 0.35
    - skill{s=SH_PlayerKill} @target ~onKill
    - skill{s=SH_Death} @self ~onDeath
    - skill{s=SH_FuegoAmigo;sync=true} @self ~onDamaged


