# Estrella de invocacion -> skill XY_ItemSummon en Skills/Xylar_Combate.yml
Xylar_EstrellaInvocacion:
  Id: NETHER_STAR
  Display: "&d&lEstrella de invocacion"
  Lore:
    - "&7Click derecho sobre el altar para invocar a &d&lXYLAR&7."
    - "&8(Usala en su altar de /warp bosses)"
  Options:
    Glowing: true
  Skills:
    - skill{s=XY_ItemSummon} @Self ~onRightClick
    - skill{s=XY_ItemSummon} @Self ~onUse

