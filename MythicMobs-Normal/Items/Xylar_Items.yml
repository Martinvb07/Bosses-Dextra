# Xylar - Sacos de recompensa por puesto en el ranking de dano.
# Click derecho -> ver Skills/Xylar_Skills.yml
# El puesto ya viene decidido en el item, asi que cada saco entrega siempre lo mismo.

Saco_Xylar_Top1:
  Id: YELLOW_DYE
  Display: "&d&lSaco de Xylar &8• &e&l1er Lugar"
  Lore:
    - "&7Polvo de estrellas de la armadura de Xylar,"
    - "&7para quien apago su galaxia."
    - ""
    - "&eClick derecho &7para abrirlo."
    - ""
    - "&8Recompensa de &d&lXYLAR"
  Skills:
    - skill{s=Xylar_Saco_Top1} @Self ~onRightClick

