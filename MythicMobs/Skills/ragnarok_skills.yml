# Ragnarok skills

Ragnarok_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&b&lRAGNAROK";subtitle="&bVolcano &8• &7El fin ha llegado";fadein=20;stay=300;duration=300;fadeout=20} @Server'
    - 'message{m="&b&lRAGNAROK &7Surge de las profundidades del volcán"} @Server'
    - effect:sound{s=entity.wither.spawn;v=0.6;p=0.8} @self
    - effect:particles{particle=SNOWFLAKE;amount=45;hS=1.2;vS=1.0;speed=0.03} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

Ragnarok_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

Ragnarok_HP75_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1987}
  Skills:
    - 'message{m="&b&lRAGNAROK &f: &7\"Aún conservo el 75% de mi poder.\""} @PlayersInRadius{r=60}'

Ragnarok_HP50_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1325}
  Skills:
    - 'message{m="&b&lRAGNAROK &f: &7\"Con el 50% de mi vida basta para sellar vuestro destino.\""} @PlayersInRadius{r=60}'

Ragnarok_HP25_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<662}
  Skills:
    - 'message{m="&b&lRAGNAROK &f: &7\"Incluso con el 25%, el fin os alcanzará.\""} @PlayersInRadius{r=60}'

Ragnarok_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<1723}
  Skills:
    - skill{s=Ragnarok_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - 'message{cooldown=9999;m="&b&lRAGNAROK &f: &7\"El frío consumirá todo.\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=220;level=0} @self
    - potion{type=SPEED;duration=220;level=0} @self
    - skill{s=Ragnarok_SummonDraugr} @self

Ragnarok_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<993}
  Skills:
    - skill{s=Ragnarok_PhaseShield} @self
    - setstance{stance=PHASE3} @self
    - 'message{cooldown=9999;m="&b&lRAGNAROK &f: &7\"No escaparéis del destino.\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=220;level=1} @self
    - potion{type=SPEED;duration=220;level=1} @self
    - skill{s=Ragnarok_IceStorm} @self
    - skill{s=Ragnarok_LightningStorm} @self
    - skill{s=Ragnarok_SummonVikings} @self

Ragnarok_Phase4_Check:
  Conditions:
    - stance{stance=PHASE3}
    - health{h=<662}
  Skills:
    - skill{s=Ragnarok_PhaseShield} @self
    - setstance{stance=LASTBREATH} @self
    - 'message{cooldown=9999;m="&b&lRAGNAROK &f: &7\"El fin os alcanzara. Corred... o pereced.\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=260;level=2} @self
    - potion{type=SPEED;duration=260;level=1} @self
    - effect:sound{s=entity.warden.roar;v=0.55;p=0.7} @self
    - effect:particles{particle=SOUL;amount=30;hS=1.0;vS=1.1;speed=0.02} @self
    - effect:particles{particle=SNOWFLAKE;amount=45;hS=1.4;vS=1.0;speed=0.04} @self
    - skill{s=Ragnarok_RunOrDie} @self

Ragnarok_PhaseShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=50;level=4} @self
    - effect:particles{particle=END_ROD;amount=25;hS=0.9;vS=1.0;speed=0.02} @self

Ragnarok_Attack_Rotation:
  Skills:
    - randomskill{skills=Ragnarok_HeavyStrike,Ragnarok_SummonVex;weights=4,2} @target ?stance{stance=PHASE1}
    - randomskill{skills=Ragnarok_HeavyStrike,Ragnarok_FreezeBurst,Ragnarok_SummonDraugr,Ragnarok_SummonVex;weights=3,3,2,3} @target ?stance{stance=PHASE2}
    - randomskill{skills=Ragnarok_HeavyStrike,Ragnarok_FreezeBurst,Ragnarok_IceStorm,Ragnarok_LightningStorm,Ragnarok_SummonVex,Ragnarok_SummonVikings;weights=3,3,2,2,3,2} @target ?stance{stance=PHASE3}
    - randomskill{skills=Ragnarok_RunOrDie,Ragnarok_LightningStorm,Ragnarok_HeavyStrike;weights=3,2,2} @target ?stance{stance=LASTBREATH}

Ragnarok_HeavyStrike:
  Conditions:
    - targetwithin{d=6}
  Skills:
    - effect:sound{s=entity.player.attack.sweep;v=0.8;p=0.7} @self
    - effect:particles{particle=SWEEP_ATTACK;amount=1} @self
    - damage{a=111;pk=true} @target
    - throw{velocity=1.0;velocityY=0.25} @target

Ragnarok_DevastatingBlow:
  Conditions:
    - targetwithin{d=4}
  Skills:
    - message{cooldown=8;m="&3Golpe devastador de &bRagnarok&f!"} @PlayersInRadius{r=40}
    - effect:sound{s=entity.iron_golem.attack;v=0.9;p=0.5} @self
    - effect:particles{particle=BLOCK_CRACK;material=ICE;amount=45;hS=1.1;vS=0.3;speed=0.10} @self
    - delay 6
    - damage{a=137;pk=true} @PlayersInRadius{r=4}
    - throw{velocity=1.2;velocityY=0.3} @PlayersInRadius{r=4}

Ragnarok_FreezeAura:
