Ragnarok_LightningStorm:
  Cooldown: 35
  Skills:
    - message{cooldown=10;m="&bRagnarok invoca una &fTormenta de Rayos&b!"} @PlayersInRadius{r=50}
    - effect:sound{s=entity.lightning_bolt.thunder;v=0.9;p=0.8} @self
    - potion{type=BLINDNESS;duration=100;level=0} @PlayersInRadius{r=12}
    - potion{type=CONFUSION;duration=100;level=0} @PlayersInRadius{r=12}
    - effect:particles{particle=CLOUD;amount=90;hS=3.0;vS=1.7;speed=0.02;yOffset=1.6} @self
    - effect:particles{particle=ELECTRIC_SPARK;amount=60;hS=2.8;vS=1.3;speed=0.03} @self
    - effect:lightning @PlayersInRadius{r=12}
    - effect:lightning @PlayersInRadius{r=12}
    - damage{a=43;pk=true} @PlayersInRadius{r=12}
    - delay 10
    - effect:sound{s=entity.lightning_bolt.impact;v=0.8;p=1.0} @self
    - effect:particles{particle=ELECTRIC_SPARK;amount=50;hS=2.8;vS=1.1;speed=0.03} @self
    - effect:lightning @PlayersInRadius{r=12}
    - effect:lightning @PlayersInRadius{r=12}
    - delay 10
