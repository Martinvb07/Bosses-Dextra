    - effect:particles{particle=ELECTRIC_SPARK;amount=50;hS=2.8;vS=1.1;speed=0.03} @self
    - effect:lightning @PlayersInRadius{r=12}
    - effect:lightning @PlayersInRadius{r=12}
    - damage{a=43;pk=true} @PlayersInRadius{r=12}

