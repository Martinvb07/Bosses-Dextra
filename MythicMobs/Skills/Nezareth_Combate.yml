# Nezareth - Skills de combate PROPIAS (antes usaba las de Yeti tal cual).
# Mecanicas basadas en Yeti, con lore, subditos y particulas de Nezareth.
# Daño de skills escalado x1.70 y umbrales de vida para 4800 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

NZ_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&8&lNEZARETH";subtitle="&7La Telaraña del Destino &8• &7La Tejedora Eterna despierta";fadein=20;stay=300;duration=300;fadeout=20} @Server'
    - 'message{m="&8&lNEZARETH &f: &7\"Cada hilo es una vida... y los vuestros ya estan cortados.\""} @Server'
    - effect:sound{s=entity.iron_golem.damage;v=0.8;p=0.6} @self
    - effect:sound{s=entity.polar_bear.warning;v=0.9;p=0.6} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=34;hS=1.2;vS=1.0;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=BLACK_WOOL;amount=28;hS=1.0;vS=0.6;speed=0.09} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=42}

NZ_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=42}

NZ_HP70_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<3360}
  Skills:
    - 'message{m="&8&lNEZARETH &f: &7\"Mis marionetas bailaran sobre vuestros cuerpos.\""} @PlayersInRadius{r=60}'

NZ_HP40_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1920}
  Skills:
    - 'message{m="&8&lNEZARETH &f: &7\"La telaraña... se cierra.\""} @PlayersInRadius{r=60}'

NZ_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<3360}
  Skills:
    - skill{s=NZ_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - 'message{cooldown=9999;m="&7Los hilos se tensan... &8Las marionetas de Nezareth despiertan."} @PlayersInRadius{r=60}'
    - effect:sound{s=entity.zombie.ambient;v=0.8;p=0.7} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=45;hS=1.6;vS=0.8;speed=0.04} @self
    - skill{s=NZ_SummonHunters} @self
    - potion{type=SPEED;duration=220;level=0} @self
    - potion{type=INCREASE_DAMAGE;duration=220;level=0} @self

NZ_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<1920}
  Skills:
    - skill{s=NZ_PhaseShield} @self
    - setstance{stance=PHASE3_LOCKED} @self
    - 'message{cooldown=9999;m="&8&lCAPULLO ETERNO &8» &fDerrota primero a sus subditos para romper la seda."} @PlayersInRadius{r=70}'
    - effect:sound{s=entity.blaze.shoot;v=0.5;p=0.5} @self
    - effect:sound{s=weather.rain.above;v=0.9;p=0.6} @self
    - effect:particles{particle=SMOKE_NORMAL;amount=70;hS=2.4;vS=1.1;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=90;hS=2.5;vS=1.2;speed=0.06} @self
    - skill{s=NZ_IntenseBlizzard} @self
    - skill{s=NZ_SummonShieldMinions} @self
    - potion{type=SPEED;duration=240;level=1} @self
    - potion{type=INCREASE_DAMAGE;duration=240;level=1} @self

NZ_PhaseShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=50;level=4} @self
    - effect:particles{particle=END_ROD;amount=20;hS=0.9;vS=1.0;speed=0.02} @self

NZ_SubjugationShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=30;level=10} @self ?stance{stance=PHASE3_LOCKED}
    - effect:particles{particle=END_ROD;amount=30;hS=1.1;vS=1.2;speed=0.02} @self ?stance{stance=PHASE3_LOCKED}
    - skill{s=NZ_SubjugationRelease} @self

NZ_SubjugationRelease:
  Conditions:
    - stance{stance=PHASE3_LOCKED}
    - mobsinradius{type=Nezareth_Marioneta;amount=<1;radius=35}
    - mobsinradius{type=Nezareth_Hilandera;amount=<1;radius=35}
    - mobsinradius{type=Nezareth_Polilla;amount=<1;radius=35}
  Skills:
    - setstance{stance=PHASE3} @self
    - 'message{cooldown=9999;m="&8&lNEZARETH &fqueda expuesta al cortarse sus hilos."} @PlayersInRadius{r=70}'
    - effect:sound{s=block.glass.break;v=0.9;p=0.6} @self
    - effect:particles{particle=FLASH;amount=1} @self

NZ_SnowPresence:
  Skills:
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=16;hS=1.8;vS=1.0;speed=0.03} @self
    - effect:particles{particle=SMOKE_NORMAL;amount=6;hS=1.2;vS=0.6;speed=0.02} @self ?stance{stance=PHASE3}
    - effect:particles{particle=SMOKE_NORMAL;amount=10;hS=1.5;vS=0.8;speed=0.03} @self ?stance{stance=PHASE3_LOCKED}

NZ_Roar:
  Conditions:
    - targetwithin{d=9999} true
  Skills:
    - effect:sound{s=entity.polar_bear.warning;v=1.0;p=0.55} @self
    - effect:sound{s=entity.iron_golem.damage;v=0.8;p=0.5} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=24;hS=1.4;vS=1.0;speed=0.04} @self

NZ_FrozenAura:
  Skills:
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=14;hS=1.6;vS=0.8;speed=0.03} @self
    - potion{type=SLOW;duration=45;level=1} @PlayersInRadius{r=5}
    - potion{type=WEAKNESS;duration=40;level=0} @PlayersInRadius{r=5} ?stance{stance=PHASE3}

NZ_Attack_Rotation:
  Skills:
    - randomskill{skills=NZ_IceSmash,NZ_IceRockThrow,NZ_FrostNova,NZ_GroundShatter;weights=3,3,2,2} @target ?stance{stance=PHASE1}
    - randomskill{skills=NZ_IceSmash,NZ_IceRockThrow,NZ_FrostNova,NZ_GroundShatter,NZ_SummonHunters;weights=3,3,2,2,2} @target ?stance{stance=PHASE2}
    - randomskill{skills=NZ_IntenseBlizzard,NZ_IceRockBarrage,NZ_FrostNova,NZ_GroundShatter,NZ_IceSmash;weights=3,2,2,3,2} @target ?stance{stance=PHASE3_LOCKED}
    - randomskill{skills=NZ_IntenseBlizzard,NZ_IceRockBarrage,NZ_FrostNova,NZ_GroundShatter,NZ_IceSmash;weights=3,3,2,3,2} @target ?stance{stance=PHASE3}

NZ_GroundShatter:
  Cooldown: 18
  Skills:
    - 'message{cooldown=10;m="&8&lTIRON DE HILOS &8» &fApartaos del impacto."} @PlayersInRadius{r=45}'
    - effect:sound{s=entity.iron_golem.attack;v=1.0;p=0.5} @self
    - effect:sound{s=entity.generic.explode;v=0.65;p=0.8} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=85;hS=2.0;vS=0.5;speed=0.12} @self
    - delay 8
    - damage{a=102;pk=true} @PlayersInRadius{r=7}
    - throw{velocity=1.6;velocityY=0.55} @PlayersInRadius{r=7}

