    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=45;hS=1.1;vS=0.3;speed=0.10} @self
    - damage{a=193;pk=true} @target
    - throw{velocity=1.1;velocityY=0.3} @target

NZ_IceRockThrow:
