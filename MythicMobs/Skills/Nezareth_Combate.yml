    - effect:particles{particle=BLOCK_CRACK;material=BLACK_WOOL;amount=70;hS=2.2;vS=0.9;speed=0.10} @self
    - delay 12
    - damage{a=204;pk=true} @PlayersInRadius{r=9}
    - potion{type=SLOW;duration=80;level=1} @PlayersInRadius{r=9}

NZ_FrostNova:
  Cooldown: 16
  Skills:
    - effect:sound{s=block.glass.break;v=0.9;p=0.6} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=65;hS=2.0;vS=0.7;speed=0.05} @self
    - damage{a=128;pk=true} @PlayersInRadius{r=7}
    - potion{type=SLOW;duration=80;level=2} @PlayersInRadius{r=7}

NZ_IntenseBlizzard:
  Cooldown: 22
  Skills:
    - 'message{cooldown=10;m="&7La seda os envuelve, os ciega y os inmoviliza..."} @PlayersInRadius{r=60}'
    - effect:sound{s=weather.rain.above;v=1.0;p=0.5} @self
    - effect:particles{particle=SMOKE_NORMAL;amount=85;hS=3.0;vS=1.2;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=COBWEB;amount=130;hS=3.2;vS=1.3;speed=0.07} @self
