# --- Fuego amigo ---
LL_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_LadyOfLaments} true
  Skills:
    - cancelevent @self

LL_InmuneColmillos:
  # Los colmillos del evocador no le hacen dano a los aliados de su faccion.
  # (El dano de los colmillos no viene de un mob con faccion, asi que
  # LL_FuegoAmigo no lo frena.)
  TriggerConditions:
    - entitytype{types=EVOKER_FANGS} true
  Skills:
    - cancelevent @self
