# Lady of Laments skills

LL_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&5&lLADY OF LAMENTS";subtitle="&dPurple Castle &8• &7Reina del Lamento Eterno";fadein=20;stay=300;duration=300;fadeout=20} @Server'
