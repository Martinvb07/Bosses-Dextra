# Samhain - Skills de combate PROPIAS (antes usaba las de Ragnarok tal cual).
# Mecanicas basadas en Ragnarok, con lore, subditos y particulas de Samhain.
# Daño de skills escalado x2.38 y umbrales de vida para 4200 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

SH_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&6&lSAMHAIN";subtitle="&eLa Noche de las Animas &8• &7El velo entre mundos se rompe";fadein=10;stay=180;duration=180;fadeout=10} @Server'
    - 'message{m="&6&lSAMHAIN &f: &7\"Esta noche los muertos caminan... y vosotros os unireis a ellos.\""} @Server'
    - effect:sound{s=entity.wither.spawn;v=0.6;p=0.8} @self
    - effect:particles{particle=FLAME;amount=45;hS=1.2;vS=1.0;speed=0.03} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

SH_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

SH_HP75_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<3149}
  Skills:
    - 'message{m="&6&lSAMHAIN &f: &7\"Las animas aun me dan tres cuartas partes de su fuerza.\""} @PlayersInRadius{r=60}'

SH_HP50_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<2100}
  Skills:
    - 'message{m="&6&lSAMHAIN &f: &7\"Con la mitad de mis almas me sobra para cosechar las vuestras.\""} @PlayersInRadius{r=60}'

SH_HP25_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1049}
  Skills:
    - 'message{m="&6&lSAMHAIN &f: &7\"Aunque me quede una sola vela encendida, la noche sera mia.\""} @PlayersInRadius{r=60}'

SH_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<2730}
  Skills:
    - skill{s=SH_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - 'message{cooldown=9999;m="&6&lSAMHAIN &f: &7\"¡Levantaos, guardianes de los campos!\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=220;level=0} @self
    - potion{type=SPEED;duration=220;level=0} @self
    - skill{s=SH_SummonDraugr} @self

SH_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<1574}
  Skills:
    - skill{s=SH_PhaseShield} @self
    - setstance{stance=PHASE3} @self
    - 'message{cooldown=9999;m="&6&lSAMHAIN &f: &7\"El velo se rasga. Ya no hay vuelta atras.\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=220;level=1} @self
    - potion{type=SPEED;duration=220;level=1} @self
    - skill{s=SH_IceStorm} @self
    - skill{s=SH_LightningStorm} @self
    - skill{s=SH_SummonVikings} @self

SH_Phase4_Check:
  Conditions:
    - stance{stance=PHASE3}
    - health{h=<1049}
  Skills:
    - skill{s=SH_PhaseShield} @self
    - setstance{stance=LASTBREATH} @self
    - 'message{cooldown=9999;m="&6&lSAMHAIN &f: &7\"Apagad las velas... la ultima cosecha comienza.\""} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=260;level=2} @self
    - potion{type=SPEED;duration=260;level=1} @self
    - effect:sound{s=entity.warden.roar;v=0.55;p=0.7} @self
    - effect:particles{particle=SOUL;amount=30;hS=1.0;vS=1.1;speed=0.02} @self
    - effect:particles{particle=FLAME;amount=45;hS=1.4;vS=1.0;speed=0.04} @self
    - skill{s=SH_RunOrDie} @self

SH_PhaseShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=50;level=4} @self
    - effect:particles{particle=END_ROD;amount=25;hS=0.9;vS=1.0;speed=0.02} @self

SH_Attack_Rotation:
  Skills:
    - randomskill{skills=SH_HeavyStrike,SH_SummonVex;weights=4,2} @target ?stance{stance=PHASE1}
    - randomskill{skills=SH_HeavyStrike,SH_FreezeBurst,SH_SummonDraugr,SH_SummonVex;weights=3,3,2,3} @target ?stance{stance=PHASE2}
    - randomskill{skills=SH_HeavyStrike,SH_FreezeBurst,SH_IceStorm,SH_LightningStorm,SH_SummonVex,SH_SummonVikings;weights=3,3,2,2,3,2} @target ?stance{stance=PHASE3}
    - randomskill{skills=SH_RunOrDie,SH_LightningStorm,SH_HeavyStrike;weights=3,2,2} @target ?stance{stance=LASTBREATH}

SH_HeavyStrike:
  Conditions:
    - targetwithin{d=6}
  Skills:
    - effect:sound{s=entity.player.attack.sweep;v=0.8;p=0.7} @self
    - effect:particles{particle=SWEEP_ATTACK;amount=1} @self
    - damage{a=186;pk=true} @target
    - throw{velocity=1.0;velocityY=0.25} @target

SH_DevastatingBlow:
  Conditions:
    - targetwithin{d=4}
  Skills:
    - 'message{cooldown=8;m="&6Guadaña de &eSamhain&f: ¡golpe de cosecha!"} @PlayersInRadius{r=40}'
    - effect:sound{s=entity.iron_golem.attack;v=0.9;p=0.5} @self
    - effect:particles{particle=BLOCK_CRACK;material=SOUL_SOIL;amount=45;hS=1.1;vS=0.3;speed=0.10} @self
