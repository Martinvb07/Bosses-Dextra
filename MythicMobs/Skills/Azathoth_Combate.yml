# Azathoth - Skills de combate PROPIAS (antes usaba las de OldEnder tal cual).
# Mecanicas basadas en OldEnder, con lore, subditos y particulas de Azathoth.
# Daño de skills escalado x1.70 y umbrales de vida para 3600 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

AZ_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&5&lAZATHOTH";subtitle="&dEl Vacio Exterior &8• &7El Caos Ancestral abre los ojos";fadein=10;stay=180;duration=180;fadeout=10} @Server'
    - 'message{m="&5&lAZATHOTH &f: &7\"Soy el sueño que sostiene vuestro mundo... y estoy despertando.\""} @Server'
    - effect:sound{s=entity.enderman.scream;v=0.8;p=0.7} @self
    - effect:particles{particle=BLOCK_CRACK;material=OBSIDIAN;amount=35;hS=1.0;vS=0.6;speed=0.08} @self
    - effect:particles{particle=PORTAL;amount=24;hS=1.2;vS=0.6;speed=0.12} @self
    - potion{type=DAMAGE_RESISTANCE;duration=80;level=1} @self
    - potion{type=FIRE_RESISTANCE;duration=999999;level=0} @self
    - delay 2
    - settarget @NearestPlayer{r=50}

AZ_Skyfall:
  Skills:
    - 'message{m="&5&lAZATHOTH &8» &d¡Las estrellas caen de un cielo que ya no existe!"} @PlayersInRadius{r=60}'
    - orbital{onTick=AZ_Skyfall_Tick;onHit=AZ_Skyfall_Hit;points=20;interval=1;duration=100;charges=5} @PlayersInRadius{r=30}

AZ_Skyfall_Tick:
  Skills:
    - effect:particles{particle=BLOCK_CRACK;material=CRYING_OBSIDIAN;amount=5;speed=0.1} @origin

AZ_Skyfall_Hit:
  Skills:
    - damage{a=60}
    - effect:particles{particle=EXPLOSION_LARGE;amount=1} @target

AZ_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=50}

AZ_HP75_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<2700}
  Skills:
    - 'message{m="&5&lAZATHOTH &8» &fEl caos aun late con el &d75% &fde su esencia..."} @PlayersInRadius{r=60}'

AZ_HP50_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1800}
  Skills:
    - 'message{m="&5&lAZATHOTH &8» &fLa mitad del Caos se desgarra: &d50% &fde vida. &5La realidad se agrieta&f."} @PlayersInRadius{r=60}'

AZ_HP25_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<900}
  Skills:
    - 'message{m="&5&lAZATHOTH &8» &fSolo un &c25% &fsostiene al dios ciego... &5y el vacio grita&f."} @PlayersInRadius{r=60}'

AZ_HP70_Lore:
  Cooldown: 9999
  Conditions:
    - health{h=<2520}
  Skills:
    - 'message{m="&5&lAZATHOTH &f: &7\"Flautistas... tocad. Que la locura llene sus oidos.\""} @PlayersInRadius{r=60}'

AZ_HP40_Lore:
  Cooldown: 9999
  Conditions:
    - health{h=<1440}
  Skills:
    - 'message{m="&5&lAZATHOTH &f: &7\"Vuestra cordura es un grano de arena en mi oceano.\""} @PlayersInRadius{r=60}'

AZ_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<2520}
  Skills:
    - skill{s=AZ_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - 'message{cooldown=9999;m="&5&lAZATHOTH &fentra en &d&lDELIRIO COSMICO&f!"} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=260;level=0} @self
    - potion{type=SPEED;duration=260;level=0} @self
    - effect:particles{particle=CLOUD;amount=30;hS=1.2;vS=0.4;speed=0.05} @self
    - effect:particles{particle=PORTAL;amount=20;hS=1.4;vS=0.6;speed=0.12} @self
    - effect:sound{s=entity.enderman.stare;v=0.7;p=0.9} @self

AZ_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<1440}
  Skills:
    - skill{s=AZ_PhaseShield} @self
    - setstance{stance=PHASE3} @self
    - 'message{cooldown=9999;m="&5&lAZATHOTH &fdesata el &c&lCAOS PRIMIGENIO&f!"} @PlayersInRadius{r=60}'
    - potion{type=INCREASE_DAMAGE;duration=240;level=1} @self
    - potion{type=SPEED;duration=240;level=1} @self
    - effect:particles{particle=FLAME;amount=25;hS=1.0;vS=0.6;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=CRYING_OBSIDIAN;amount=35;hS=1.2;vS=0.6;speed=0.08} @self
    - effect:particles{particle=PORTAL;amount=28;hS=1.6;vS=0.8;speed=0.12} @self
    - effect:sound{s=entity.enderman.scream;v=0.9;p=0.5} @self
    - skill{s=AZ_SummonWardens} @self

AZ_Phase4_Check:
  Conditions:
    - stance{stance=PHASE3}
    - health{h=<540}
  Skills:
    - skill{s=AZ_PhaseShield} @self
    - setstance{stance=LASTBREATH} @self
    - 'message{cooldown=9999;m="&5&lAZATHOTH &fdespierta del todo: &c&lFIN DE LA REALIDAD&f!"} @PlayersInRadius{r=70}'
    - potion{type=INCREASE_DAMAGE;duration=220;level=2} @self
    - potion{type=SPEED;duration=220;level=1} @self
    - potion{type=DAMAGE_RESISTANCE;duration=120;level=1} @self
    - effect:sound{s=entity.enderman.scream;v=1.0;p=0.5} @self
    - effect:sound{s=entity.enderman.stare;v=0.9;p=0.7} @self
    - effect:particles{particle=FLASH;amount=1} @self
    - effect:particles{particle=FLAME;amount=28;hS=1.4;vS=0.8;speed=0.04} @self
    - effect:particles{particle=PORTAL;amount=36;hS=2.0;vS=1.0;speed=0.12} @self
    - skill{s=AZ_SummonWardens} @self
    - skill{s=AZ_Skyfall} @self

AZ_DesertSummons_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<2520}
  Skills:
    - effect:particles{particle=BLOCK_CRACK;material=OBSIDIAN;amount=36;hS=1.4;vS=0.5;speed=0.10} @self
    - summon{type=Azathoth_Flautista;amount=2;radius=8;noise=2} @self
    - summon{type=Azathoth_Sacerdote;amount=1;radius=8;noise=2} @self

AZ_IntenseSandstorm_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1440}
  Skills:
    - skill{s=AZ_Sandstorm} @self
    - effect:sound{s=entity.phantom.flap;v=0.8;p=0.5} @self
    - effect:particles{particle=CLOUD;amount=70;hS=3.5;vS=0.9;speed=0.04} @self
    - summon{type=Azathoth_Larva;amount=2;radius=8;noise=3} @self

AZ_PhaseShield:
  Skills:
    - potion{type=DAMAGE_RESISTANCE;duration=60;level=4} @self
    - effect:particles{particle=SPELL_MOB_AMBIENT;amount=25;hS=1.0;vS=0.5;speed=0.02} @self

AZ_EnderPresence:
  Skills:
    - effect:particles{particle=PORTAL;amount=8;hS=1.3;vS=0.6;speed=0.08} @self ?stance{stance=PHASE2}
    - effect:particles{particle=PORTAL;amount=14;hS=1.7;vS=0.7;speed=0.10} @self ?stance{stance=PHASE3}
    - effect:particles{particle=FLAME;amount=10;hS=1.5;vS=0.7;speed=0.02} @self ?stance{stance=LASTBREATH}
    - effect:particles{particle=PORTAL;amount=18;hS=2.0;vS=0.9;speed=0.12} @self ?stance{stance=LASTBREATH}

AZ_KeepFight:
  Conditions:
    - targetwithin{d=9999} true
  Skills:
    - skill{s=AZ_PullBack} @target

AZ_PullBack:
  Conditions:
    - distance{d=>75}
  Skills:
    - 'message{cooldown=60;m="&dEl vacio te arrastra de vuelta hacia &5Azathoth&f..."} @target'
    - effect:particles{particle=BLOCK_CRACK;material=OBSIDIAN;amount=25;hS=0.7;vS=0.4;speed=0.06} @target
    - pull{velocity=1.2} @target

AZ_Attack_Rotation:
  Skills:
    - skill{s=AZ_TeleportStrike} @target 0.30 ?stance{stance=PHASE1}
    - skill{s=AZ_SandPulse} @self 0.35 ?stance{stance=PHASE1}
    - skill{s=AZ_EnderGaze} @target 0.35 ?stance{stance=PHASE1}

    - skill{s=AZ_Sandstorm} @self 0.25 ?stance{stance=PHASE2}
    - skill{s=AZ_SummonWardens} @self 0.20 ?stance{stance=PHASE2}
    - skill{s=AZ_SandWarp} @target 0.25 ?stance{stance=PHASE2}
    - skill{s=AZ_EnderGaze} @target 0.30 ?stance{stance=PHASE2}

    - skill{s=AZ_SandPulse} @self 0.20 ?stance{stance=PHASE3}
    - skill{s=AZ_EnderGaze} @target 0.25 ?stance{stance=PHASE3}
    - skill{s=AZ_Sandstorm} @self 0.20 ?stance{stance=PHASE3}
    - skill{s=AZ_DesertCollapse} @self 0.20 ?stance{stance=PHASE3}
    - skill{s=AZ_SummonWardens} @self 0.15 ?stance{stance=PHASE3}

    - skill{s=AZ_SandWarp} @target 0.25 ?stance{stance=LASTBREATH}
    - skill{s=AZ_SandstormRift} @self 0.25 ?stance{stance=LASTBREATH}
    - skill{s=AZ_EnderGaze} @target 0.20 ?stance{stance=LASTBREATH}
    - skill{s=AZ_SandPulse} @self 0.15 ?stance{stance=LASTBREATH}
    - skill{s=AZ_Sandstorm} @self 0.15 ?stance{stance=LASTBREATH}

# TeleportStrike: Teleporta y golpea con confusión y rayo de partículas mágicas
AZ_TeleportStrike:
  Conditions:
    - targetwithin{d=18}
  Skills:
    - effect:sound{s=entity.enderman.teleport;v=1.0;p=1.2} @self
    - leap{velocity=200;noise=1} @target
    - delay 12
    - effect:particles{particle=ENCHANT;amount=18;hS=0.2;vS=0.7;speed=0.5} @self
    - effect:particles{particle=PORTAL;amount=24;hS=0.7;vS=0.3;speed=0.15} @target
    - damage{a=85;pk=true} @target ?distance{d=<3}
    - potion{type=CONFUSION;duration=60;level=0} @target

# SandPulse: Onda de arena mágica que empuja y ralentiza
AZ_SandPulse:
  Cooldown: 12
  Conditions:
    - targetwithin{d=12}
  Skills:
    - 'message{cooldown=8;m="&5Azathoth &fdesata una onda de pura entropia!"} @PlayersInRadius{r=45}'
    - effect:sound{s=entity.enderman.stare;v=0.95;p=0.7} @self
    - effect:particles{particle=ENCHANT;amount=24;hS=1.2;vS=0.7;speed=0.7} @self
    - effect:particles{particle=CLOUD;amount=55;hS=2.4;vS=0.7;speed=0.04} @self
    - effect:particles{particle=BLOCK_CRACK;material=OBSIDIAN;amount=65;hS=2.6;vS=0.6;speed=0.11} @self
    - damage{a=65;pk=true} @PlayersInRadius{r=8}
    - throw{velocity=1.35;velocityY=0.45} @PlayersInRadius{r=8}
    - potion{type=SLOW;duration=60;level=1} @PlayersInRadius{r=8}

# DesertCollapse: Golpe de suelo, daño en área y lanzamiento
AZ_DesertCollapse:
  Skills:
    - 'message{cooldown=10;m="&5Azathoth &fgolpea el tejido de la realidad... ¡el suelo se deshace!"} @PlayersInRadius{r=45}'
    - effect:sound{s=entity.generic.explode;v=0.65;p=0.85} @self
    - effect:sound{s=entity.enderman.scream;v=0.7;p=1.0} @self
    - effect:particles{particle=ENCHANT;amount=30;hS=1.0;vS=0.8;speed=0.8} @self
    - effect:particles{particle=BLOCK_CRACK;material=CRYING_OBSIDIAN;amount=60;hS=1.6;vS=0.5;speed=0.12} @self
    - delay 10
    - damage{a=92;pk=true} @PlayersInRadius{r=9}
    - throw{velocity=1.5;velocityY=0.7} @PlayersInRadius{r=9}

# EnderGaze: Mirada mágica, ceguera y daño, rayos de partículas
AZ_EnderGaze:
  Conditions:
    - targetwithin{d=35}
  Skills:
    - 'message{cooldown=6;m="&5Azathoth &fte mira sin ojos... &dy tu mente se quiebra!"} @PlayersInRadius{r=45}'
    - effect:sound{s=entity.enderman.stare;v=0.9;p=1.1} @self
    - effect:particles{particle=ENCHANT;amount=22;hS=0.5;vS=0.7;speed=0.7} @self
    - effect:particles{particle=PORTAL;amount=26;hS=0.6;vS=0.5;speed=0.13} @target
    - delay 10
    - damage{a=68;pk=true} @target
    - potion{type=BLINDNESS;duration=45;level=0} @target

# AZ_EnderGaze cubre ambos ataques de mirada mágica

AZ_Sandstorm:
  Skills:
    - effect:sound{s=entity.ender_dragon.flap;v=0.7;p=0.55} @self
    - effect:particles{particle=CLOUD;amount=50;hS=2.4;vS=0.8;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=OBSIDIAN;amount=70;hS=2.8;vS=0.7;speed=0.10} @self
    - potion{type=SLOW;duration=90;level=1} @PlayersInRadius{r=16}
    - potion{type=WEAKNESS;duration=90;level=0} @PlayersInRadius{r=16}

# SandWarp: Teleport múltiple, daño y empuje
AZ_SandWarp:
  Cooldown: 20
  Conditions:
    - targetwithin{d=45}
  Skills:
    - 'message{cooldown=10;m="&5Azathoth &fse pliega entre dimensiones hacia sus presas!"} @PlayersInRadius{r=50}'
    - effect:sound{s=entity.enderman.teleport;v=1.0;p=1.2} @self
