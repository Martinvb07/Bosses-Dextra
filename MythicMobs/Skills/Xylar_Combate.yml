# Xylar - Skills de combate PROPIAS (antes usaba las de RedHand tal cual).
# Mecanicas basadas en RedHand, con lore, subditos y particulas de Xylar.
# Daño de skills escalado x0.95 y umbrales de vida para 4000 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

XY_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&d&lXYLAR";subtitle="&5Trono Galactico &8• &7El Señor de las estrellas desciende";fadein=10;stay=180;duration=180;fadeout=10} @Server'
    - 'message{m="&d&lXYLAR &f: &7\"He apagado mil soles. Vuestro mundo es solo uno mas.\""} @Server'
    - effect:sound{s=entity.wither_skeleton.ambient;v=0.9;p=0.8} @self
    - effect:particles{particle=SMOKE_LARGE;amount=25;hS=0.7;vS=0.9;speed=0.03} @self
    - potion{type=DAMAGE_RESISTANCE;duration=60;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

XY_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

