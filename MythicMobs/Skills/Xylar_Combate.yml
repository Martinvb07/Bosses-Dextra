# Item summon

# --- Fuego amigo ---
XY_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_Xylar} true
  Skills:
    - cancelevent @self

# --- Invocacion con estrella (/warp bosses) ---
# TODO: poner las coordenadas reales del altar de Xylar. Hay que cambiarlas en
#       las DOS lineas marcadas con <<< (distancefromlocation y @Location).
XY_ItemSummon:
  Conditions:
    - skilloncooldown{skill=XY_ItemSummon_AtCoords} castinstead XY_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast XY_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=0.5;y=100;z=0.5;world=Spawn;distance=<6} orElseCast XY_ItemSummon_Fail_NotAtSpot   # <<<
  Skills:
    - skill{s=XY_ItemSummon_AtCoords} @Location{x=0.5;y=100;z=0.5;world=Spawn}   # <<<

XY_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=Xylar;amount=<1;r=100} orElseCast XY_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=0.85} @self
    - particlering{particle=REDSTONE;radius=3.0;points=48;amount=1;hS=0;vS=0;speed=0.0;color=#5a0f7a;size=1.25} @targetlocation{y=0.1}
    - particlering{particle=REDSTONE;radius=1.6;points=28;amount=1;hS=0;vS=0;speed=0.0;color=#ff4dff;size=1.15} @targetlocation{y=0.1}
    - delay 8
    - effect:particles{particle=PORTAL;amount=60;hS=0.7;vS=0.2;speed=0.15} @targetlocation{y=1}
    - effect:particles{particle=SMOKE_LARGE;amount=14;hS=0.7;vS=0.6;speed=0.02} @targetlocation{y=1}
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=Xylar;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumehelditem{a=1} @self
    - message{cooldown=2;m="&d&lXYLAR &8» &aInvocado."} @self

XY_ItemSummon_Fail_AlreadyActive:
  Skills:
    - message{cooldown=2;m="&d&lXYLAR &8» &7Ya hay un &dXylar &7cerca. Mata al boss antes de invocar otro."} @self

XY_ItemSummon_Fail_NotAtSpot:
  Skills:
    - message{cooldown=2;m="&d&lXYLAR &8» &eNo estas en el &6Altar de Invocacion&e. &7Acercate al altar para usar la estrella."} @self

XY_ItemSummon_Fail_WrongWorld:
  Skills:
    - message{cooldown=2;m="&d&lXYLAR &8» &eLa invocacion no responde en este lugar. &7Regresa al &6Altar de Invocacion&7."} @self

XY_ItemSummon_Fail_Cooldown:
  Skills:
    - message{cooldown=2;m="&d&lXYLAR &8» &7La estrella aun se esta recargando. &fEspera un momento&7."} @self
