    - randomskill{skills=KK_Wail,KK_ShroudOfNight,KK_SpiritSiphon;weights=4,3,3} @target ?stance{stance=PHASE1}
    - randomskill{skills=KK_Wail,KK_ShroudOfNight,KK_SpiritSiphon,KK_ShadowHunt,KK_SummonBanshees,KK_GriefMark;weights=3,3,3,2,2,2} @target ?stance{stance=PHASE2}
