# Kukulkan - Skills de combate PROPIAS (antes usaba las de LadyOfLaments tal cual).
# Mecanicas basadas en LadyOfLaments, con lore, subditos y particulas de Kukulkan.
# Daño de skills escalado x6.47 y umbrales de vida para 4600 HP (curva de dificultad 01->17).
# Los sacos / ranking siguen en sus archivos de siempre.

KK_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&a&lKUKULKAN";subtitle="&ePiramide del Sol &8• &7La Serpiente Emplumada despliega sus alas";fadein=20;stay=300;duration=300;fadeout=20} @Server'
    - 'message{m="&a&lKUKULKAN &f: &7“El sol exige sangre... y hoy la ofrenda sois vosotros.”"} @Server'
    - effect:sound{s=entity.ghast.ambient;v=0.8;p=0.7} @self
    - effect:sound{s=block.amethyst_block.resonate;v=0.9;p=0.9} @self
    - effect:particles{particle=END_ROD;amount=20;hS=1.0;vS=1.0;speed=0.02} @self
    - effect:particles{particle=SMOKE_LARGE;amount=24;hS=0.8;vS=0.8;speed=0.03} @self
    - effect:particles{particle=REDSTONE;amount=40;hS=1.1;vS=1.0;speed=0.0;color=#ffd23f;size=1.35} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=40}

KK_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=40}

KK_HP70_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<3220}
  Skills:
    - 'message{m="&a&lKUKULKAN &f: &7“Escuchad el canto de las plumas...”"} @PlayersInRadius{r=60}'

KK_HP40_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1839}
  Skills:
    - 'message{m="&a&lKUKULKAN &f: &7“El sol os quemara hasta los huesos.”"} @PlayersInRadius{r=60}'

