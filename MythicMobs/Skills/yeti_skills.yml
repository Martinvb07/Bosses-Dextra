Yeti_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&b&lYETI";subtitle="&fIce Biome &8• &7Bestia del Invierno Eterno";fadein=10;stay=180;duration=180;fadeout=10} @Server'
    - 'message{m="&b&lYETI &f: &7Intrusos... en mi montana..."} @Server'
    - effect:sound{s=entity.iron_golem.damage;v=0.8;p=0.6} @self
    - effect:sound{s=entity.polar_bear.warning;v=0.9;p=0.6} @self
    - effect:particles{particle=SNOWFLAKE;amount=34;hS=1.2;vS=1.0;speed=0.03} @self
    - effect:particles{particle=BLOCK_CRACK;material=BLUE_ICE;amount=28;hS=1.0;vS=0.6;speed=0.09} @self
    - potion{type=DAMAGE_RESISTANCE;duration=70;level=2} @self
    - delay 2
    - settarget @NearestPlayer{r=42}

Yeti_AcquireTarget:
  Conditions:
    - targetwithin{d=9999} false
  Skills:
    - settarget @NearestPlayer{r=42}

Yeti_HP70_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<2240}
  Skills:
    - 'message{m="&b&lYETI &f: &7La horda os destrozara."} @PlayersInRadius{r=60}'

Yeti_HP40_Check:
  Cooldown: 9999
  Conditions:
    - health{h=<1280}
  Skills:
    - 'message{m="&b&lYETI &f: &7El invierno... os sepultara."} @PlayersInRadius{r=60}'

Yeti_Phase2_Check:
  Conditions:
    - stance{stance=PHASE1}
    - health{h=<2240}
  Skills:
    - skill{s=Yeti_PhaseShield} @self
    - setstance{stance=PHASE2} @self
    - 'message{cooldown=9999;m="&fLa nieve cruje... &bLos cazadores del Yeti despiertan."} @PlayersInRadius{r=60}'
    - effect:sound{s=entity.zombie.ambient;v=0.8;p=0.7} @self
    - effect:particles{particle=SNOWFLAKE;amount=45;hS=1.6;vS=0.8;speed=0.04} @self
    - skill{s=Yeti_SummonHunters} @self
    - potion{type=SPEED;duration=220;level=0} @self
    - potion{type=INCREASE_DAMAGE;duration=220;level=0} @self

Yeti_Phase3_Check:
  Conditions:
    - stance{stance=PHASE2}
    - health{h=<1280}
  Skills:
