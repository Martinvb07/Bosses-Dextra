    - potion{type=DAMAGE_RESISTANCE;duration=30;level=10} @self ?stance{stance=PHASE3_LOCKED}
    - effect:particles{particle=END_ROD;amount=30;hS=1.1;vS=1.2;speed=0.02} @self ?stance{stance=PHASE3_LOCKED}
