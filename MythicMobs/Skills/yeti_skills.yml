    - effect:particles{particle=SNOWFLAKE;amount=90;hS=2.5;vS=1.2;speed=0.06} @self
    - skill{s=Yeti_IntenseBlizzard} @self
    - skill{s=Yeti_SummonShieldMinions} @self
    - potion{type=SPEED;duration=240;level=1} @self
    - potion{type=INCREASE_DAMAGE;duration=240;level=1} @self

Yeti_PhaseShield:
