# Item summon
Yeti_ItemSummon:
  Conditions:
    - skilloncooldown{skill=Yeti_ItemSummon_AtCoords} castinstead Yeti_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast Yeti_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=890.5;y=118;z=783.5;world=Spawn;distance=<2} orElseCast Yeti_ItemSummon_Fail_NotAtSpot
  Skills:
    - skill{s=Yeti_ItemSummon_AtCoords} @Location{x=890.5;y=118;z=783.5;world=Spawn}

Yeti_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=Yeti;amount=<1;r=100} orElseCast Yeti_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=0.8} @self
    - particlering{particle=REDSTONE;radius=3.0;points=48;amount=1;hS=0;vS=0;speed=0.0;color=#9fe6ff;size=1.25} @targetlocation{y=0.1}
    - particlering{particle=REDSTONE;radius=1.6;points=28;amount=1;hS=0;vS=0;speed=0.0;color=#d8f4ff;size=1.15} @targetlocation{y=0.1}
    - effect:particles{particle=SNOWFLAKE;amount=36;hS=0.9;vS=0.2;speed=0.06} @targetlocation{y=0.3}
    - effect:particles{particle=CLOUD;amount=16;hS=0.7;vS=0.4;speed=0.02} @targetlocation{y=0.8}
    - delay 8
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=Yeti;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumehelditem{a=1} @self
    - message{cooldown=2;m="&b&lYETI &8» &aInvocado."} @self

Yeti_ItemSummon_Fail_AlreadyActive:
  Skills:
    - 'message{cooldown=2;m="&b&lYETI &8» &7Ya hay un &bYeti &7cerca. Mata al boss antes de invocar otro."} @self'

Yeti_ItemSummon_Fail_NotAtSpot:
  Skills:
    - 'message{cooldown=2;m="&b&lYETI &8» &eNo estas en el &6Altar de Invocacion&e. &7Acercate al altar para usar la estrella."} @self'

Yeti_ItemSummon_Fail_WrongWorld:
  Skills:
    - 'message{cooldown=2;m="&b&lYETI &8» &eLa invocacion no responde en este lugar. &7Regresa al &6Altar de Invocacion&7."} @self'

Yeti_ItemSummon_Fail_Cooldown:
  Skills:
    - 'message{cooldown=2;m="&b&lYETI &8» &7La estrella aun se esta recargando. &fEspera un momento&7."} @self'

# --- Fuego amigo ---
Yeti_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_Yeti} true
  Skills:
    - cancelevent @self
