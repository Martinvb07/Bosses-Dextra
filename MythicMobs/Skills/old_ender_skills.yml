# TeleportStrike: Teleporta y golpea con confusión y rayo de partículas mágicas
OD_TeleportStrike:
  Conditions:
    - targetwithin{d=18}
  Skills:
    - effect:sound{s=entity.enderman.teleport;v=1.0;p=1.2} @self
    - leap{velocity=200;noise=1} @target
    - delay 12
    - effect:particles{particle=ENCHANT;amount=18;hS=0.2;vS=0.7;speed=0.5} @self
    - effect:particles{particle=PORTAL;amount=24;hS=0.7;vS=0.3;speed=0.15} @target
    - damage{a=45;pk=true} @target ?distance{d=<3}
    - potion{type=CONFUSION;duration=60;level=0} @target

# SandPulse: Onda de arena mágica que empuja y ralentiza
OD_SandPulse:
  Cooldown: 12
