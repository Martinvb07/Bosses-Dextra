# Item summon
OD_ItemSummon:
  Conditions:
    - skilloncooldown{skill=OD_ItemSummon_AtCoords} castinstead OD_ItemSummon_Fail_Cooldown
    - world{w=Spawn} orElseCast OD_ItemSummon_Fail_WrongWorld
    - distancefromlocation{x=-1200.5;y=65;z=-490.5;world=Spawn;distance=<6} orElseCast OD_ItemSummon_Fail_NotAtSpot
  Skills:
    - skill{s=OD_ItemSummon_AtCoords} @Location{x=-1200.5;y=65;z=-490.5;world=Spawn}

OD_ItemSummon_AtCoords:
  Cooldown: 60
  TargetConditions:
    - mobsinradius{type=OldEnder;amount=<1;r=100} orElseCast OD_ItemSummon_Fail_AlreadyActive
  Skills:
    - effect:sound{s=entity.evoker.prepare_summon;v=0.9;p=0.8} @self
    - particlering{particle=REDSTONE;radius=3.0;points=48;amount=1;hS=0;vS=0;speed=0.0;color=#d6b25a;size=1.25} @targetlocation{y=0.1}
    - particlering{particle=REDSTONE;radius=1.6;points=28;amount=1;hS=0;vS=0;speed=0.0;color=#f2d27a;size=1.15} @targetlocation{y=0.1}
    - effect:particles{particle=BLOCK_CRACK;material=SAND;amount=30;hS=0.9;vS=0.2;speed=0.10} @targetlocation{y=0.2}
    - delay 8
    - effect:particles{particle=PORTAL;amount=80;hS=1.0;vS=0.25;speed=0.15} @targetlocation{y=1}
    - effect:particles{particle=SMOKE_LARGE;amount=14;hS=0.8;vS=0.6;speed=0.02} @targetlocation{y=1}
    - effect:particles{particle=FLASH;amount=1} @targetlocation{y=1}
    - summon{type=OldEnder;amount=1;radius=1;noise=0;summonerIsOwner=false;summonerIsParent=false} @targetlocation{y=1}
    - delay 1
    - consumehelditem{a=1} @self
    - message{cooldown=2;m="&5&lOLD ENDER &8» &aInvocado."} @self

OD_ItemSummon_Fail_AlreadyActive:
  Skills:
    - message{cooldown=2;m="&5&lOLD ENDER &8» &7Ya hay un &5OldEnder &7cerca. Mata al boss antes de invocar otro."} @self

OD_ItemSummon_Fail_NotAtSpot:
  Skills:
    - message{cooldown=2;m="&5&lOLD ENDER &8» &7No estas en el &5Altar de Invocacion&7. &fAcercate al altar para usar la estrella."} @self

OD_ItemSummon_Fail_WrongWorld:
  Skills:
    - message{cooldown=2;m="&5&lOLD ENDER &8» &7La invocacion no responde en este lugar. &fRegresa al &5Altar de Invocacion&7."} @self

OD_ItemSummon_Fail_Cooldown:
  Skills:
    - message{cooldown=2;m="&5&lOLD ENDER &8» &7La estrella aun se esta recargando. &fEspera un momento&7."} @self

# --- Fuego amigo ---
OD_FuegoAmigo:
  # Anula el daño que recibe este mob si viene de otro mob de su misma faccion
  # (flechas de los arqueros aliados, explosiones de creepers aliados, etc).
  TriggerConditions:
    - faction{f=Boss_OldEnder} true
  Skills:
    - cancelevent @self
