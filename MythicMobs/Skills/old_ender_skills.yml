    - effect:particles{particle=CLOUD;amount=55;hS=2.4;vS=0.7;speed=0.04} @self
    - effect:particles{particle=BLOCK_CRACK;material=SAND;amount=65;hS=2.6;vS=0.6;speed=0.11} @self
    - damage{a=34;pk=true} @PlayersInRadius{r=8}
    - throw{velocity=1.35;velocityY=0.45} @PlayersInRadius{r=8}
    - potion{type=SLOW;duration=60;level=1} @PlayersInRadius{r=8}

