# OldEnder + SandWarden skills
OD_Spawn:
  Skills:
    - setstance{stance=PHASE1} @self
    - 'title{title="&5&lOLD ENDER";subtitle="&eDesert Biome &8• &7El ancestral emerge entre arenas";fadein=20;stay=300;duration=300;fadeout=20} @Server'
    - 'message{m="&5&lOLD ENDER &fse materializa entre las arenas..."} @Server'
    - effect:sound{s=entity.enderman.scream;v=0.8;p=0.7} @self
    - effect:particles{particle=BLOCK_CRACK;material=SAND;amount=35;hS=1.0;vS=0.6;speed=0.08} @self
    - effect:particles{particle=PORTAL;amount=24;hS=1.2;vS=0.6;speed=0.12} @self
    - potion{type=DAMAGE_RESISTANCE;duration=80;level=1} @self
    - potion{type=FIRE_RESISTANCE;duration=999999;level=0} @self
    - delay 2
    - settarget @NearestPlayer{r=50}

OD_Skyfall:
