    - skill{s=Baal_AntiKite} @self ~onTimer:35
    - skill{s=Baal_PlayerKill} @target ~onKill
    - skill{s=Baal_Death} @self ~onDeath
    - skill{s=Baal_FuegoAmigo;sync=true} @self ~onDamaged

