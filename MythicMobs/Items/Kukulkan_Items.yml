# Estrella de invocacion -> skill KK_ItemSummon en Skills/Kukulkan_Combate.yml
Kukulkan_EstrellaInvocacion:
  Id: NETHER_STAR
  Display: "&a&lEstrella de invocacion"
  Lore:
    - "&7Click derecho sobre el altar para invocar a &a&lKUKULKAN&7."
    - "&8(Usala en su altar de /warp bosses)"
  Options:
    Glowing: true
  Skills:
    - skill{s=KK_ItemSummon} @Self ~onRightClick
    - skill{s=KK_ItemSummon} @Self ~onUse

