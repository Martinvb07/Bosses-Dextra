# Kukulkan - Sacos de recompensa por puesto en el ranking de dano.
# Click derecho -> ver Skills/Kukulkan_Skills.yml
# El puesto ya viene decidido en el item, asi que cada saco entrega siempre lo mismo.

Saco_Kukulkan_Top1:
  Id: YELLOW_DYE
  Display: "&a&lSaco de Kukulkan &8• &e&l1er Lugar"
  Lore:
    - "&7Oro del templo de la Serpiente Solar,"
    - "&7para quien le arranco mas plumas."
