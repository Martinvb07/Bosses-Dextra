# 50 a 80 niveles de experiencia (siempre da una de estas cantidades)
Recompensas_xp:
  TotalItems: 1
  MaxItems: 1
  Drops:
    - command{c="minecraft:xp add <trigger.name> 50 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 55 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 60 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 65 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 70 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 75 levels"} 1
    - command{c="minecraft:xp add <trigger.name> 80 levels"} 1
