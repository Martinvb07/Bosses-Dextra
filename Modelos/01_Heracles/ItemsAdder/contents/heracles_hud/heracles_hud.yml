# HUD de Heracles: font images de ItemsAdder. Funciona CON y SIN resource pack.
#
#   Bossbar (Heracles_Mobs.yml -> BossBar.Title):   "&f‌&6&lHERACLES&f "
#   Titulo: ya no va aqui; los laureles estan en Modelos/DextraBossesPack (fuente dextra:hud),
#   ver tools/heracles_title.py.
#
# ‌ (ancho cero) y   (espacio) no se ven en
# vanilla: SIN pack los titulos se ven exactamente como antes. CON pack se
# convierten en las mitades del marco y en los laureles.
# Las texturas se generan con tools/generate_hud.py (no las recortes: el
# ancho de cada png esta calculado para que el marco cuadre con la barra).
info:
  namespace: heracles_hud

font_images:
  bossbar_left:
    path: font/bossbar_left.png
    symbol: "‌"
    # 48 = alto del png (escala 1:1). y_position 18 coloca el hueco del
    # marco justo encima de la barra (el hueco esta en la fila 20 del png).
    scale_ratio: 48
    y_position: 18
    show_in_gui: false
    shadow:
      enabled: false

  bossbar_right:
    path: font/bossbar_right.png
    symbol: " "
    scale_ratio: 48
    y_position: 18
    show_in_gui: false
    shadow:
      enabled: false
