# Heracles + Hoplit

Heracles:
  Type: PIGLIN_BRUTE
  Display: "&6&lHERACLES"
  Health: 2046
  Damage: 50
  Armor: 1400
  Faction: Boss_Heracles

  Equipment:
    - GOLD_SWORD:HAND
    - Heracles_PetoOro:CHEST
    - Heracles_PantalonesOro:LEGS
    - Heracles_BotasOro:FEET
    - "PLAYER_HEAD{skullTexture=eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYzg4MmVkN2IyMDdjZDlhN2NmYjIxMTEzMmY2ZWZmMTg0ODM1MzNiOTM3NzExNjk0NWNkZjZhMGJhZmU3ZjM1YSJ9fX0=}:HEAD"

  # Title = marco olímpico (font image de ItemsAdder, symbol \uE7A0) que se
  # dibuja alrededor de la barra. No añadas texto: descuadraría el marco.
  # La barra AMARILLA usa la textura de HeraclesPack. Style SOLID para que
  # las muescas vanilla no tapen el diseño (los segmentos ya van dibujados).
  BossBar:
    Enabled: true
    Title: "&f\uE7A0"
    Range: 40
    Color: YELLOW
    Style: SOLID

  Options:
    AlwaysShowName: true
    Despawn: false
    PreventOtherDrops: true
    Silent: true
    MovementSpeed: 0.30
    KnockbackResistance: 1
    FollowRange: 40
    PreventSunburn: true
    PreventRandomEquipment: true
    UseThreatTable: false

  AIGoalSelectors:
    - clear
    - meleeattack
    - movetowardstarget

  AITargetSelectors:
    - clear
    - players

  Drops:
    - Recompensas_xp
    - Recompensas_runas
    - Recompensas_dinero
    - Recompensas_llaves
    - OD_EstrellaInvocacion 1 1

  # Modelo de ModelEngine (blueprint: plugins/ModelEngine/blueprints/heracles/heracles.bbmodel)
  # El cuerpo vanilla (piglin brute) queda invisible; el hitbox lo define el hueso "hitbox" del modelo.
  Skills:
    - model{mid=heracles} @self ~onSpawn
    - setstance{stance=PHASE1} @self ~onSpawn
    - skill{s=Heracles_Intro} @self ~onSpawn
    - skill{s=Heracles_Hurt} @self ~onDamaged 0.35
    - skill{s=Heracles_AcquireTarget} @self ~onTimer:10

    - skill{s=Heracles_Slam} @target ~onAttack 0.35
    - skill{s=Heracles_Quake} @target ~onTimer:12 0.40
    - skill{s=Heracles_OlympusRoar} @self ~onTimer:18 0.35
    - skill{s=Heracles_Charge} @target ~onTimer:60 0.60
    - skill{s=Heracles_AntiRun} @self ~onTimer:160

    - skill{s=Heracles_HP75_Check} @self ~onTimer:20
    - skill{s=Heracles_HP50_Check} @self ~onTimer:20
    - skill{s=Heracles_HP25_Check} @self ~onTimer:20
    - skill{s=Heracles_HP70_Lore} @self ~onTimer:20
    - skill{s=Heracles_HP40_Lore} @self ~onTimer:20

    - skill{s=Heracles_Phase2_Check} @self ~onTimer:20
    - skill{s=Heracles_Phase3_Check} @self ~onTimer:20

    - skill{s=Heracles_LastBreath} @self ~onTimer:20
    - skill{s=Heracles_LowHP_Buff} @self ~onTimer:40

    - skill{s=Heracles_PlayerKill} @target ~onKill
    - skill{s=Heracles_Death} @self ~onDeath
    - skill{s=Heracles_FuegoAmigo;sync=true} @self ~onDamaged

Hoplit:
  Type: ZOMBIE
  Display: "&6Hoplita"
  Health: 682
  Damage: 10
  Armor: 35
  Faction: Boss_Heracles

  Equipment:
    - IRON_SWORD:HAND
    - SHIELD:OFFHAND
    - GOLD_HELMET:HEAD

  Options:
    Despawn: true
    PreventOtherDrops: true
    PreventRandomEquipment: true
    MovementSpeed: 0.26
    FollowRange: 25

  #Drops:
  AITargetSelectors:
    - clear
    - players

  # Modelo de ModelEngine: plugins/ModelEngine/blueprints/hoplit/hoplit.bbmodel
  Skills:
    - model{mid=hoplit} @self ~onSpawn
    - state{mid=hoplit;s=spawn;li=0;lo=2} @self ~onSpawn
    - state{mid=hoplit;s=attack;li=1;lo=2} @self ~onAttack
    - state{mid=hoplit;s=hurt;li=1;lo=2} @self ~onDamaged 0.3
    - skill{s=Heracles_FuegoAmigo;sync=true} @self ~onDamaged


